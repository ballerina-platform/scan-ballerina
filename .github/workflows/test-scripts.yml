name: Scripts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # test/annotations/findings.json has a finding without a rule, a message with a newline and a tab,
  # a file name with "," and ":", a finding without a file and a message that looks like a workflow
  # command. The annotation commands must match test/annotations/expected.txt.
  annotation-commands:
    name: Annotation commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write the annotations and compare with the golden file
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/annotation-commands"
          mkdir -p "$WORK"
          cp test/annotations/findings.json "$WORK/"
          : > "$WORK/sonarqube-failures.txt"
          # The commands go to a file, so that they do not annotate this job.
          SCAN_WORK_DIR="$WORK" CATEGORY=annotations ANNOTATIONS=true JOB_SUMMARY=false \
            HIGH=1 MEDIUM=1 LOW=2 TOTAL=4 PACKAGES_SCANNED=1 bash scripts/report.sh > "$WORK/stdout.txt"
          diff -u test/annotations/expected.txt <(grep '^::' "$WORK/stdout.txt")

  # test/sarif holds three bal scan reports: of a package whose path has a space and of a
  # workspace, with run.artifacts, artifact indexes, a test file among the artifacts, a '#' in a
  # file name and a backslash in a URI, and of a package whose results name their rule by rule.id,
  # rule.index or ruleIndex only, or not at all. The merged file must match test/sarif/expected.sarif.
  sarif-golden:
    name: SARIF merging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Merge the reports and compare with the golden files
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sarif-golden"
          mkdir -p "$WORK"
          cp -r test/sarif/units.json test/sarif/reports "$WORK/"
          SCAN_WORK_DIR="$WORK" EXCLUDE_PATHS= CATEGORY=golden bash scripts/merge-sarif.sh
          diff -u test/sarif/expected.sarif <(jq -S . "$WORK/golden.sarif")
          diff -u test/sarif/expected-findings.json <(jq -S . "$WORK/findings.json")

      # test/sarif/legacy holds a report of bal scan 0.11.0, which sets no rule kind, help or full
      # description, and takes each rule's level from its kind.
      - name: Merge a bal scan 0.11.0 report
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/sarif-legacy"
          mkdir -p "$WORK"
          cp -r test/sarif/legacy/units.json test/sarif/legacy/reports "$WORK/"
          SCAN_WORK_DIR="$WORK" EXCLUDE_PATHS= CATEGORY=legacy bash scripts/merge-sarif.sh
          RULES="$(jq -c '.runs[0].tool.driver.rules | map({key: .id, value: [.properties.ruleKind, (.properties.tags // [])]}) | from_entries' "$WORK/legacy.sarif")"
          [ "$RULES" = '{"ballerina/example:1":["VULNERABILITY",["security"]],"ballerina/example:2":["BUG",[]],"ballerina:1":["CODE_SMELL",["maintainability"]]}' ] \
            || fail "Each rule's kind must be taken from its level: $RULES"
          jq -e '.runs[0].tool.driver.rules | all(.help.markdown | contains("- **Type:** "))' "$WORK/legacy.sarif" > /dev/null \
            || fail "Each rule's help must name its type"
          [ "$(jq -c '[.[] | .severity]' "$WORK/findings.json")" = '["low","medium","high"]' ] \
            || fail "The severities must follow the levels: $(jq -c . "$WORK/findings.json")"

      # A result may name its file only by artifactLocation.index. It must get the artifact's path,
      # and exclude-paths must apply to it.
      - name: Merge a report whose results name their file by index only
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/sarif-index"
          mkdir -p "$WORK/reports"
          echo '[{"path": "pkg", "kind": "package", "members": []}]' > "$WORK/units.json"
          jq -n '{version: "2.1.0", runs: [{
            tool: {driver: {name: "Ballerina Scan Tool", rules: [{id: "ballerina:1", defaultConfiguration: {level: "note"}}]}},
            artifacts: [{location: {uri: "main.bal"}}, {location: {uri: "gen/skip.bal"}}],
            results: [
              {ruleId: "ballerina:1", message: {text: "a"}, locations: [{physicalLocation: {artifactLocation: {index: 0}, region: {startLine: 3}}}]},
              {ruleId: "ballerina:1", message: {text: "b"}, locations: [{physicalLocation: {artifactLocation: {index: 1}, region: {startLine: 4}}}]}
            ]}]}' > "$WORK/reports/0.sarif"
          SCAN_WORK_DIR="$WORK" EXCLUDE_PATHS=pkg/gen CATEGORY=index GITHUB_OUTPUT=/dev/null bash scripts/merge-sarif.sh
          FILES="$(jq -c '[.[].file]' "$WORK/findings.json")"
          [ "$FILES" = '["pkg/main.bal"]' ] || fail "Expected the finding in pkg/main.bal only, got $FILES"

      # test/sarif/suppressed holds a package whose results are suppressed as accepted, with and
      # without a status, under review, or not at all (an empty array), and a package that sets no
      # suppressions.
      - name: Merge reports with suppressions
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # Usage: merge NAME SUPPRESSIONS
          merge() {
            local work="$RUNNER_TEMP/sarif-$1"
            mkdir -p "$work"
            cp -r test/sarif/suppressed/units.json test/sarif/suppressed/reports "$work/"
            : > "$work/output.txt"
            SCAN_WORK_DIR="$work" EXCLUDE_PATHS= CATEGORY="$1" SUPPRESSIONS="$2" \
              GITHUB_OUTPUT="$work/output.txt" bash scripts/merge-sarif.sh
          }
          output() { grep "^$2=" "$RUNNER_TEMP/sarif-$1/output.txt" | cut -d= -f2-; }

          merge suppressed ''
          W="$RUNNER_TEMP/sarif-suppressed"
          COUNTS="$(output suppressed high-count) $(output suppressed low-count) $(output suppressed total-count) $(output suppressed suppressed-count)"
          [ "$COUNTS" = "1 2 3 2" ] || fail "Expected 1 high, 2 low, 3 counted and 2 suppressed findings, got $COUNTS"
          jq -e '.runs[0].results | all(has("suppressions"))' "$W/suppressed.sarif" > /dev/null \
            || fail "Every result of the merged run must have suppressions"
          jq -e '[.runs[0].results[] | select(.locations[0].physicalLocation.artifactLocation.uri == "lib/lib.bal") | .suppressions] == [[]]' \
            "$W/suppressed.sarif" > /dev/null || fail "A result without suppressions must get an empty array"
          # The SARIF file is also what code scanning gets, so pull requests show the suppressed findings.
          [ "$(jq '.runs[0].results | length' "$W/suppressed.sarif")" = 5 ] || fail "The SARIF file must keep the suppressed results"
          ! grep -q '^upload-file=' "$W/output.txt" || fail "No separate upload file must be written"
          [ "$(jq -r '[.[] | select(.suppressed) | .justification] | join("|")' "$W/results.json")" = 'Legacy hash kept for the migration window, SEC-1042|' ] \
            || fail "results.json must keep each suppression's justification"

          merge ignored false
          COUNTS="$(output ignored total-count) $(output ignored suppressed-count)"
          [ "$COUNTS" = "5 0" ] || fail "suppressions: false must count every finding, got $COUNTS"

      - name: Validate the merged files against the SARIF 2.1.0 schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sarif-schema.json" https://json.schemastore.org/sarif-2.1.0.json
          pipx run check-jsonschema --schemafile "$RUNNER_TEMP/sarif-schema.json" \
            "$RUNNER_TEMP/sarif-golden/golden.sarif" "$RUNNER_TEMP/sarif-suppressed/suppressed.sarif"

  # alert-changes.jq picks the code scanning alerts to dismiss, record, reopen and set to fixed on
  # the default branch, and the dismissed alerts of unsuppressed findings off it. The alerts are
  # faked as the code scanning API lists them.
  alert-changes:
    name: Alert dismissal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the alerts picked for each kind of result
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/alert-changes"
          mkdir -p "$WORK"
          MARKER="Suppressed in source with @scan:Suppress"
          jq -n '[
            {rule: "r:1", file: "a.bal", line: 1, column: 1, suppressed: true, justification: "Accepted"},
            {rule: "r:1", file: "a.bal", line: 2, column: 1, suppressed: false, justification: ""},
            {rule: "r:1", file: "a.bal", line: 3, column: 1, suppressed: true, justification: ""},
            {rule: "r:1", file: "a.bal", line: 4, column: 1, suppressed: true, justification: ""},
            {rule: "r:1", file: "a.bal", line: 4, column: 1, suppressed: false, justification: ""},
            {rule: "r:1", file: "a.bal", line: 5, column: 1, suppressed: false, justification: ""}
          ]' > "$WORK/results.json"
          # alert(number, state, line, category, reason, comment), last reported at commit "new".
          # Line 9 has no result.
          jq -n --arg m "$MARKER" '
            def alert($n; $state; $line; $cat; $reason; $comment):
              {number: $n, state: $state, rule: {id: "r:1"}, dismissed_reason: $reason, dismissed_comment: $comment,
               most_recent_instance: {category: $cat, commit_sha: "new",
                 location: {path: "a.bal", start_line: $line, start_column: 1}}};
            alert(1; "open"; 1; "bal-scan/"; null; null),
            alert(2; "open"; 2; "bal-scan/"; null; null),
            alert(3; "open"; 3; "other/"; null; null),
            alert(4; "open"; 4; "bal-scan/"; null; null),
            alert(5; "dismissed"; 2; "bal-scan"; "won'"'"'t fix"; "\($m): old"),
            alert(6; "dismissed"; 5; "bal-scan/"; "won'"'"'t fix"; "Dismissed by hand"),
            alert(7; "dismissed"; 1; "bal-scan/"; "won'"'"'t fix"; "\($m): Accepted"),
            alert(8; "dismissed"; 3; "bal-scan/"; "false positive"; "Not reachable"),
            alert(9; "dismissed"; 9; "bal-scan/"; "won'"'"'t fix"; "\($m): Gone"),
            alert(10; "dismissed"; 9; "bal-scan/"; "false positive"; "Dismissed by hand"),
            alert(11; "dismissed"; 1; "bal-scan/"; "won'"'"'t fix"; "\($m): Old reason"),
            # Last reported at an older commit, at the line of a result that now has another alert.
            (alert(12; "dismissed"; 1; "bal-scan/"; "won'"'"'t fix"; "\($m): Accepted") | .most_recent_instance.commit_sha = "old"),
            (alert(13; "dismissed"; 1; "bal-scan/"; "false positive"; "Dismissed by hand") | .most_recent_instance.commit_sha = "old")
          ' > "$WORK/alerts.jsonl"
          picked() {
            jq -sc -f scripts/alert-changes.jq --slurpfile results "$WORK/results.json" \
              --arg category bal-scan --arg marker "$MARKER" --arg reason "won't fix" --argjson limit 280 \
              --arg sha "$([ "$1" = change ] && echo new)" --arg mode "$1" "$WORK/alerts.jsonl" | jq -sc .
          }
          CHANGES="$(picked change)"
          EXPECTED="$(jq -nc --arg m "$MARKER" '[
            {number: 1, kind: "dismiss", patches: [{state: "dismissed", dismissed_reason: "won'"'"'t fix", dismissed_comment: "\($m): Accepted"}]},
            {number: 5, kind: "reopen", patches: [{state: "open"}]},
            {number: 8, kind: "record", patches: [{state: "open"}, {state: "dismissed", dismissed_reason: "false positive", dismissed_comment: "\($m)."}]},
            {number: 9, kind: "fix", patches: [{state: "open"}]},
            {number: 11, kind: "record", patches: [{state: "open"}, {state: "dismissed", dismissed_reason: "won'"'"'t fix", dismissed_comment: "\($m): Accepted"}]},
            {number: 12, kind: "fix", patches: [{state: "open"}]}
          ]')"
          # 3 is another category, 4 has a suppressed and a reported result, 6 and 10 were dismissed
          # by hand and are not suppressed, 7 already has this suppression's comment, and 13 was
          # dismissed by hand and not reported.
          [ "$CHANGES" = "$EXPECTED" ] || fail "Expected $EXPECTED, got $CHANGES"
          # Off the default branch, the dismissed alerts whose results are reported unsuppressed.
          UNSUPPRESSED="$(picked unsuppressed)"
          EXPECTED='[{"number":5,"rule":"r:1","file":"a.bal","line":2,"url":null,"own":true,"reason":"won'"'"'t fix"},{"number":6,"rule":"r:1","file":"a.bal","line":5,"url":null,"own":false,"reason":"won'"'"'t fix"}]'
          [ "$UNSUPPRESSED" = "$EXPECTED" ] || fail "Expected $EXPECTED, got $UNSUPPRESSED"

  # Off the default branch, dismiss-alerts.sh warns at each unsuppressed finding that code scanning
  # matches to a dismissed alert: one the action dismissed whose suppression the pull request
  # removed, and one dismissed by anyone whose finding the default branch no longer has. Removing
  # the annotation line moves the finding, so the alerts must be read on the pull request's ref,
  # where code scanning has the new line, not on the default branch. The API is faked.
  removed-suppressions:
    name: Removed suppressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the warnings of removed suppressions on a pull request
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/removed-suppressions"
          mkdir -p "$WORK/bin"
          MARKER="Suppressed in source with @scan:Suppress"
          PR_REF=refs/pull/36/merge
          # A fake curl. For an alert listing it records the ref and prints the alerts of that ref in
          # the state asked for, from $ALERTS_DIR/<ref with / as _>.json. For the instances of alert N
          # it records the ref and prints $ALERTS_DIR/instances-N.json.
          cat > "$WORK/bin/curl" << 'EOF'
          #!/usr/bin/env bash
          ref="" state="" url=""
          while [ $# -gt 0 ]; do
            case "$1" in
              --data-urlencode | -d)
                case "$2" in ref=*) ref="${2#ref=}" ;; state=*) state="${2#state=}" ;; esac
                shift 2 ;;
              https://*) url="$1" && shift ;;
              *) shift ;;
            esac
          done
          if [[ "$url" == */instances ]]; then
            n="${url%/instances}" && n="${n##*/}"
            echo "$n $ref" >> "$INSTANCES_FILE"
            cat "$ALERTS_DIR/instances-$n.json" 2> /dev/null || echo '[]'
            exit 0
          fi
          echo "$ref" >> "$REFS_FILE"
          jq -c --arg s "$state" '[.[] | select(.state == $s)]' "$ALERTS_DIR/${ref//\//_}.json" 2> /dev/null || echo '[]'
          EOF
          chmod +x "$WORK/bin/curl"
          echo '{"repository": {"default_branch": "main"}}' > "$WORK/event.json"
          echo '{"version": "2.1.0", "runs": [{"tool": {"driver": {"name": "Ballerina Scan Tool"}}, "results": []}]}' > "$WORK/merged.sarif"
          # alert(number, line, reason, comment): a dismissed ballerina/jwt:5 alert in auth.bal.
          ALERT_DEF='def alert($n; $line; $reason; $comment):
            {number: $n, state: "dismissed", rule: {id: "ballerina/jwt:5"}, dismissed_reason: $reason,
             dismissed_comment: $comment, html_url: "https://example.test/alerts/\($n)",
             most_recent_instance: {category: "bal-scan/", location: {path: "auth.bal", start_line: $line, start_column: 5}}};'
          # Usage: check NAME PR_LINE [listed]. With listed, suppression-changes.sh found the jwt:5
          # annotation removed in the diff and warned there, so alert 43 is counted but not warned.
          # On the pull request, its unsuppressed findings sit at PR_LINE,
          # 20, 30 and 40, matching dismissed alerts:
          #   43 at PR_LINE, dismissed by the action, on main: warned as unsuppressed.
          #   44 at 20, dismissed by hand, on main: a decision about the finding, not warned.
          #   45 at 30, dismissed by hand, never on main: warned as reintroduced.
          #   46 at 40, dismissed by the action, fixed on main: warned as reintroduced.
          check() {
            local dir="$WORK/$1" out
            mkdir -p "$dir/alerts"
            : > "$dir/refs.txt"
            : > "$dir/instances.txt"
            jq -n --argjson line "$2" '[$line, 20, 30, 40][]
              | {rule: "ballerina/jwt:5", file: "auth.bal", line: ., column: 5, suppressed: false, justification: ""}' \
              | jq -s . > "$dir/results.json"
            cp "$WORK/merged.sarif" "$dir/"
            jq -n --arg m "$MARKER" "$ALERT_DEF"' [alert(43; 12; "won'"'"'t fix"; "\($m): Accepted"),
              alert(44; 20; "false positive"; "Dismissed by hand"), alert(46; 40; "won'"'"'t fix"; "\($m).")]' \
              > "$dir/alerts/refs_heads_main.json"
            jq -n --arg m "$MARKER" --argjson line "$2" "$ALERT_DEF"' [alert(43; $line; "won'"'"'t fix"; "\($m): Accepted"),
              alert(44; 20; "false positive"; "Dismissed by hand"), alert(45; 30; "used in tests"; "Dismissed by hand"),
              alert(46; 40; "won'"'"'t fix"; "\($m).")]' \
              > "$dir/alerts/${PR_REF//\//_}.json"
            echo '[{"ref": "refs/heads/main", "state": "open"}]' > "$dir/alerts/instances-43.json"
            echo '[{"ref": "refs/heads/main", "state": "open"}]' > "$dir/alerts/instances-44.json"
            echo '[{"ref": "refs/heads/main", "state": "fixed"}]' > "$dir/alerts/instances-46.json"
            local warned=3
            if [ "${3:-}" = listed ]; then
              warned=2
              echo '{"branch": "main", "added": [], "removed": [{"file": "auth.bal", "line": 9, "base-line": 9, "text": "@scan:Suppress {rules: [\"ballerina/jwt:5\"], reason: \"Accepted\"}"}]}' \
                > "$dir/suppression-changes.json"
            fi
            PATH="$WORK/bin:$PATH" ALERTS_DIR="$dir/alerts" REFS_FILE="$dir/refs.txt" INSTANCES_FILE="$dir/instances.txt" \
              SCAN_WORK_DIR="$dir" GITHUB_TOKEN=fake GITHUB_REPOSITORY=owner/repo GITHUB_REF="$PR_REF" \
              GITHUB_EVENT_PATH="$WORK/event.json" DEFAULT_BRANCH=false SARIF_ID= CATEGORY=bal-scan \
              bash scripts/dismiss-alerts.sh > "$dir/log.txt"
            out="$(grep '^::warning' "$dir/log.txt" || true)"
            [ "$(grep -c . <<< "$out")" -eq "$warned" ] || fail "$1: expected $warned warnings, got: $out"
            if [ "$warned" -eq 3 ]; then
              grep -q "^::warning file=auth.bal,line=$2,.*no longer suppressed.*/alerts/43$" <<< "$out" \
                || fail "$1: expected an unsuppressed warning for alert 43 at line $2, got: $out"
            else
              ! grep -q "/alerts/43$" <<< "$out" || fail "$1: expected no warning for alert 43, got: $out"
            fi
            grep -q "^::warning file=auth.bal,line=30,.*dismissed by hand as used in tests.*/alerts/45$" <<< "$out" \
              || fail "$1: expected a reintroduced warning for alert 45, got: $out"
            grep -q "^::warning file=auth.bal,line=40,.*while it was suppressed.*/alerts/46$" <<< "$out" \
              || fail "$1: expected a reintroduced warning for alert 46, got: $out"
            [ "$(sort -u "$dir/refs.txt")" = "$PR_REF" ] || fail "$1: expected the alerts of $PR_REF only, listed $(sort -u "$dir/refs.txt" | paste -sd ' ')"
            [ "$(cut -d' ' -f2 "$dir/instances.txt" | sort -u)" = refs/heads/main ] \
              || fail "$1: expected the instances on main only, read $(cat "$dir/instances.txt")"
            [ "$(jq -c . "$dir/alerts.json")" = '{"unsuppressed":1,"reintroduced":2,"branch":"main"}' ] \
              || fail "$1: unexpected alerts.json $(cat "$dir/alerts.json")"
          }

          # The annotation sat on its own line above the finding, so removing it moved the finding up.
          check shifted 10
          # The finding kept its line, such as when its rule was taken out of an annotation that still
          # suppresses other rules.
          check unshifted 12
          check listed 10 listed

      # suppression-changes.sh reads the annotations a pull request adds and removes from the diff with
      # the base commit: a warning at each added one and at each removed one.
      - name: Check the annotations of added and removed suppressions
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/suppression-changes"
          REPO="$WORK/repo"
          mkdir -p "$REPO"
          git -C "$REPO" init -q
          git -C "$REPO" config user.email test@example.test
          git -C "$REPO" config user.name test
          git -C "$REPO" checkout -qb main
          printf '%s\n' 'import ballerina/jwt;' '' '@scan:Suppress {rules: ["ballerina/jwt:5"], reason: "Accepted"}' \
            'function a() {}' '' '@scan:Suppress {rules: ["ballerina/jwt:1"]}' 'function b() {}' \
            '@scan:Suppress {rules: ["x:1"]}' 'function c() {}' '@scan:Suppress {rules: ["x:1"]}' 'function d() {}' \
            '@scan:Suppress {rules: ["x:1"]}' 'function e() {}' \
            '@scan:Suppress {' '    rules: ["y:1"],' '    reason: "Several lines"' '}' 'function f() {}' \
            '@scan:Suppress {rules: ["z:1"], reason: "Old"}' 'function g() {}' 'function i() {}' 'function j() {}' > "$REPO/auth.bal"
          printf '%s\n' '@scan:Suppress {rules: ["v:1"]}' 'function h() {}' > "$REPO/other.bal"
          git -C "$REPO" add -A && git -C "$REPO" commit -qm base
          BASE="$(git -C "$REPO" rev-parse HEAD)"
          # Removes the jwt:5 annotation, moves the jwt:1 one, removes two of the three identical x:1
          # ones, changes the rules of the multi-line one, changes only the reason of the z:1 one, and
          # adds a one-line n:1 annotation and a multi-line m:1 one to existing functions.
          git -C "$REPO" checkout -qb pr
          printf '%s\n' 'import ballerina/jwt;' '' 'function a() {}' '' 'function b() {}' \
            '@scan:Suppress {rules: ["ballerina/jwt:1"]}' 'function c() {}' 'function d() {}' \
            '@scan:Suppress {rules: ["x:1"]}' 'function e() {}' \
            '@scan:Suppress {' '    rules: ["w:1"],' '    reason: "Several lines"' '}' 'function f() {}' \
            '@scan:Suppress {rules: ["z:1"], reason: "New"}' 'function g() {}' \
            '@scan:Suppress {rules: ["n:1"], reason: "Checked"}' 'function i() {}' \
            '@scan:Suppress {' '    rules: ["m:1"]' '}' 'function j() {}' > "$REPO/auth.bal"
          git -C "$REPO" commit -qam head
          # The base branch removes an annotation after BASE, which the pull request must not be blamed
          # for, and GitHub checks out the merge commit.
          git -C "$REPO" checkout -q main
          printf '%s\n' 'function h() {}' > "$REPO/other.bal"
          git -C "$REPO" commit -qam "base moves on"
          git -C "$REPO" merge -q --no-ff pr -m merge
          jq -n --arg sha "$BASE" --arg head "$(git -C "$REPO" rev-parse pr)" \
            '{repository: {default_branch: "main"}, pull_request: {base: {sha: $sha}, head: {sha: $head}}}' > "$WORK/event.json"
          # Usage: check_changes NAME, on the commit checked out in $REPO.
          check_changes() {
            SCAN_WORK_DIR="$WORK" GITHUB_EVENT_PATH="$WORK/event.json" GITHUB_WORKSPACE="$REPO" CATEGORY=bal-scan CODE_SCANNING=true \
              bash scripts/suppression-changes.sh > "$WORK/log.txt"
            ! grep -q '^::notice' "$WORK/log.txt" || fail "$1: expected no notices, got: $(grep '^::notice' "$WORK/log.txt")"
            removed="$(grep '^::warning.*removes @scan:Suppress' "$WORK/log.txt" || true)"
            added="$(grep '^::warning.*::Suppressed rule' "$WORK/log.txt" || true)"
            [ "$(grep -c '^::warning' "$WORK/log.txt")" -eq 7 ] || fail "$1: expected seven warnings, got: $(grep '^::warning' "$WORK/log.txt")"
            [ "$(grep -c . <<< "$removed")" -eq 4 ] || fail "$1: expected four removal warnings, got: $removed"
            grep -q '^::warning file=auth.bal,line=3,.*removes @scan:Suppress {rules: \["ballerina/jwt:5"\].*dismissed on main' <<< "$removed" \
              || fail "$1: expected a warning for the jwt:5 annotation at line 3, got: $removed"
            [ "$(grep -c 'removes @scan:Suppress {rules: \["x:1"\]}' <<< "$removed")" -eq 2 ] \
              || fail "$1: expected two warnings for the x:1 annotations, got: $removed"
            grep -q 'removes @scan:Suppress {rules: \["y:1"\]}' <<< "$removed" \
              || fail "$1: expected a warning for the y:1 rules, got: $removed"
            [ "$(grep -c . <<< "$added")" -eq 3 ] || fail "$1: expected three addition warnings, got: $added"
            grep -q '^::warning file=auth.bal,line=12,.*::Suppressed rule: w:1%0ASuppressed reason: not given%0A.*whether or not a reviewer accepts it\.$' <<< "$added" \
              || fail "$1: expected a warning for the w:1 rules at line 12, got: $added"
            grep -q '^::warning file=auth.bal,line=18,.*::Suppressed rule: n:1%0ASuppressed reason: Checked%0A' <<< "$added" \
              || fail "$1: expected a warning for the n:1 annotation at line 18, got: $added"
            grep -q '^::warning file=auth.bal,line=20,.*::Suppressed rule: m:1%0A' <<< "$added" \
              || fail "$1: expected a warning for the multi-line m:1 annotation at line 20, got: $added"
            ! grep -q 'other.bal\|z:1\|jwt:1' <<< "$removed$added" || fail "$1: unexpected annotation in: $removed$added"
            [ "$(jq -c '[.branch, (.added | map(.line)), (.removed | map([.line, ."base-line"]))]' "$WORK/suppression-changes.json")" \
              = '["main",[12,18,20],[[3,3],[6,8],[8,10],[12,15]]]' ] \
              || fail "$1: unexpected suppression-changes.json $(cat "$WORK/suppression-changes.json")"
            [ "$(jq -r '.head' "$WORK/suppression-changes.json")" = "$(git -C "$REPO" rev-parse HEAD)" ] \
              || fail "$1: expected head to be the checked out commit"
          }
          check_changes merge
          # A checkout of the pull request's head is compared from where it branched off.
          git -C "$REPO" checkout -q pr
          check_changes head
          [ "$(jq -r '.base' "$WORK/suppression-changes.json")" = "$BASE" ] || fail "Expected base to be the fork point"
          # Without code scanning, the annotations do not mention alerts.
          SCAN_WORK_DIR="$WORK" GITHUB_EVENT_PATH="$WORK/event.json" GITHUB_WORKSPACE="$REPO" CATEGORY=bal-scan \
            bash scripts/suppression-changes.sh > "$WORK/log.txt"
          ! grep -q 'on main' "$WORK/log.txt" || fail "Expected no mention of code scanning, got: $(cat "$WORK/log.txt")"
          # With suppressions off, an annotation changes nothing.
          SCAN_WORK_DIR="$WORK" GITHUB_EVENT_PATH="$WORK/event.json" GITHUB_WORKSPACE="$REPO" SUPPRESSIONS=false \
            bash scripts/suppression-changes.sh > "$WORK/log.txt"
          [ "$(jq -c . "$WORK/suppression-changes.json")" = '{}' ] || fail "Expected no check with suppressions off"

  # pr-comment.sh comments the reason of each suppressed finding on a line the pull request adds: in
  # the thread of code scanning's comment on its alert, or else at the line.
  pr-comment:
    name: Pull request comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the replies and comments created, updated and left alone
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/pr-comment"
          mkdir -p "$WORK/bin" "$WORK/repo" "$WORK/alerts"
          # A fake curl. GET prints $PR_FILE, $FILES_FILE, $ALERTS_DIR/<n>.json, the conversation's
          # comments from $ISSUE_COMMENTS_FILE, or the review comments by the URL: $COMMENTS_FILE, or
          # $COMMENTS_FILE.later from the second read on when it exists. POST
          # and PATCH record the method and URL in $CALLS_FILE and the request body in $PAYLOADS_FILE.
          cat > "$WORK/bin/curl" << 'EOF'
          #!/usr/bin/env bash
          method=GET url=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -X) method="$2" && shift 2 ;;
              https://*) url="$1" && shift ;;
              *) shift ;;
            esac
          done
          if [ "$method" = GET ]; then
            case "$url" in
              */files) cat "$FILES_FILE" ;;
              */issues/*/comments) cat "$ISSUE_COMMENTS_FILE" 2> /dev/null || echo '[]' ;;
              */comments)
                echo x >> "$READS_FILE"
                if [ -f "$COMMENTS_FILE.later" ] && [ "$(wc -l < "$READS_FILE")" -ge 2 ]; then
                  cat "$COMMENTS_FILE.later"
                else
                  cat "$COMMENTS_FILE"
                fi
                ;;
              */code-scanning/alerts/*) echo "${url##*/}" >> "$ALERT_READS_FILE" && cat "$ALERTS_DIR/${url##*/}.json" ;;
              *) cat "$PR_FILE" ;;
            esac
            exit 0
          fi
          echo "$method $url" >> "$CALLS_FILE"
          cat >> "$PAYLOADS_FILE"
          echo >> "$PAYLOADS_FILE"
          echo '{}'
          EOF
          chmod +x "$WORK/bin/curl"
          echo '{"pull_request": {"number": 7, "head": {"sha": "0123456789abcdef"}}}' > "$WORK/event.json"
          echo '{"head": {"sha": "0123456789abcdef"}}' > "$WORK/pr.json"
          echo '{"runs": [{"tool": {"driver": {"name": "Ballerina Scan Tool"}}}]}' > "$WORK/merged.sarif"
          printf '%s\n' 'import ballerina/scan;' '' '@scan:Suppress {rules: ["ballerina:1"]}' 'function a() returns int {' \
            '    return checkpanic int:fromString("1");' '}' 'function b() returns int {' \
            '    return checkpanic int:fromString("2");' '}' > "$WORK/repo/main.bal"
          # The pull request adds lines 3 to 6, but its line 4 differs from the checked out one, as
          # when the base branch changed the file since.
          jq -n '[{filename: "main.bal", patch: "@@ -1,2 +1,6 @@\n import ballerina/scan;\n \n+@scan:Suppress {rules: [\"ballerina:1\"]}\n+function a() returns int { // changed on the base\n+    return checkpanic int:fromString(\"1\");\n+}"}]' \
            > "$WORK/files.json"
          # Line 5: two suppressed findings on an added line. Line 4: its text differs from the head's.
          # Line 8: not added. Line 1: not suppressed. Severity none: not counted.
          jq -n '[
            {severity: "low", rule: "ballerina:1", message: "Avoid checkpanic", file: "main.bal", line: 5, suppressed: true, justification: "Checked by <gateway>, ask @org/team"},
            {severity: "medium", rule: "ballerina:7", message: "Line\nbreak", file: "main.bal", line: 5, suppressed: true, justification: ""},
            {severity: "low", rule: "ballerina:3", message: "m", file: "main.bal", line: 4, suppressed: true, justification: "r"},
            {severity: "low", rule: "ballerina:4", message: "m", file: "main.bal", line: 8, suppressed: true, justification: "r"},
            {severity: "high", rule: "ballerina:2", message: "m", file: "main.bal", line: 1, suppressed: false, justification: ""},
            {severity: "none", rule: "ballerina:9", message: "m", file: "main.bal", line: 5, suppressed: true, justification: "r"}]' \
            > "$WORK/results.json"
          # Code scanning commented alert 67, of ballerina:1, at line 5. Comment 901 at the same line is
          # another tool's alert 68, so ballerina:7 has no thread.
          echo '{"rule": {"id": "ballerina:1"}, "tool": {"name": "Ballerina Scan Tool"}}' > "$WORK/alerts/67.json"
          echo '{"rule": {"id": "ballerina:7"}, "tool": {"name": "CodeQL"}}' > "$WORK/alerts/68.json"
          BOT='{"user": {"login": "github-advanced-security[bot]"}, "in_reply_to_id": null, "path": "main.bal", "line": 5}'
          HUMAN='{"id": 1, "user": {"login": "octocat"}, "in_reply_to_id": null, "path": "main.bal", "line": 5, "body": "Looks good"}'
          THREAD="$(jq -c '. + {id: 900, body: "## Ballerina Scan Tool / Avoid checkpanic\n\n[Show more details](https://github.com/owner/repo/security/code-scanning/67)"}' <<< "$BOT")"
          OTHER="$(jq -c '. + {id: 901, body: "## CodeQL / Something\n\n[Show more details](https://github.com/owner/repo/security/code-scanning/68)"}' <<< "$BOT")"
          M1='<!-- scan-ballerina:suppression:bal-scan:ballerina:1 -->'
          M7='<!-- scan-ballerina:suppression:bal-scan:ballerina:7 -->'
          # Usage: [BOT_TIMEOUT=...] [CODE_SCANNING=...] run
          run() {
            : > "$WORK/calls.txt"
            : > "$WORK/payloads.jsonl"
            : > "$WORK/reads.txt"
            : > "$WORK/alert-reads.txt"
            PATH="$WORK/bin:$PATH" PR_FILE="$WORK/pr.json" FILES_FILE="$WORK/files.json" COMMENTS_FILE="$WORK/comments.json" \
              READS_FILE="$WORK/reads.txt" ALERT_READS_FILE="$WORK/alert-reads.txt" ALERTS_DIR="$WORK/alerts" CALLS_FILE="$WORK/calls.txt" \
              PAYLOADS_FILE="$WORK/payloads.jsonl" ISSUE_COMMENTS_FILE="$WORK/issue-comments.json" \
              SCAN_WORK_DIR="$WORK" GITHUB_TOKEN=fake GITHUB_REPOSITORY=owner/repo \
              GITHUB_WORKSPACE="$WORK/repo" GITHUB_EVENT_PATH="$WORK/event.json" CATEGORY=bal-scan \
              CODE_SCANNING="${CODE_SCANNING:-true}" BOT_TIMEOUT="${BOT_TIMEOUT:-0}" BOT_POLL=1 \
              bash scripts/pr-comment.sh > "$WORK/log.txt"
          }
          payload() { jq -sr --arg url "$1" --slurpfile calls <(jq -R . "$WORK/calls.txt") \
            '[$calls, .] | transpose | map(select(.[0] | endswith($url))) | first | .[1].body' "$WORK/payloads.jsonl"; }

          # ballerina:1 gets a reply in its thread, and ballerina:7, without one, a comment at the line.
          jq -n --argjson a "$HUMAN" --argjson b "$THREAD" --argjson c "$OTHER" '[$a, $b, $c]' > "$WORK/comments.json"
          run
          [ "$(sort "$WORK/calls.txt" | paste -sd ' ')" = "POST https://api.github.com/repos/owner/repo/pulls/7/comments POST https://api.github.com/repos/owner/repo/pulls/7/comments/900/replies" ] \
            || fail "Expected a reply to 900 and a comment, got: $(cat "$WORK/calls.txt")"
          REPLY="$(payload /900/replies)"
          [ "$(head -n1 <<< "$REPLY")" = "$M1" ] || fail "Expected the reply to start with its marker, got: $REPLY"
          grep -qxF "$(printf '**Reason:** Checked by &lt;gateway&gt;, ask @​org/team')" <<< "$REPLY" \
            || fail "Expected the reason without HTML or a mention, got: $REPLY"
          ! grep -qF 'Avoid checkpanic' <<< "$REPLY" || fail "Expected the reply to leave the message to code scanning's comment, got: $REPLY"
          jq -se '.[] | select(.path) | .path == "main.bal" and .line == 5 and .side == "RIGHT" and .commit_id == "0123456789abcdef"' \
            "$WORK/payloads.jsonl" > /dev/null || fail "Expected the comment at line 5 of the head, got: $(cat "$WORK/payloads.jsonl")"
          OWN="$(payload /pulls/7/comments)"
          [ "$(head -n1 <<< "$OWN")" = "$M7" ] || fail "Expected the comment to start with its marker, got: $OWN"
          grep -qxF '> **medium** `ballerina:7`: Line break' <<< "$OWN" || fail "Expected the finding's message on one line, got: $OWN"
          grep -qxF '> **Reason:** _No reason given_' <<< "$OWN" || fail "Expected a missing reason to be said, got: $OWN"
          [ "$(sort "$WORK/alert-reads.txt" | paste -sd ' ')" = "67 68" ] || fail "Expected alerts 67 and 68 to be read once, read: $(cat "$WORK/alert-reads.txt")"

          # Code scanning comments only after the first look: the step waits for it, then replies.
          jq -n --argjson a "$HUMAN" '[$a]' > "$WORK/comments.json"
          jq -n --argjson a "$HUMAN" --argjson b "$THREAD" '[$a, $b]' > "$WORK/comments.json.later"
          BOT_TIMEOUT=5 run
          rm "$WORK/comments.json.later"
          grep -qxF "POST https://api.github.com/repos/owner/repo/pulls/7/comments/900/replies" "$WORK/calls.txt" \
            || fail "Expected a reply once code scanning commented, got: $(cat "$WORK/calls.txt")"
          grep -q 'did not comment every alert within 5s' "$WORK/log.txt" || fail "Expected ballerina:7 to stop the wait, got: $(cat "$WORK/log.txt")"

          # Without an upload to code scanning nothing is waited for, and both get comments at the line.
          jq -n --argjson b "$THREAD" '[$b]' > "$WORK/comments.json"
          CODE_SCANNING=false run
          [ "$(grep -c '/pulls/7/comments$' "$WORK/calls.txt")" -eq 2 ] || fail "Expected two comments at the line, got: $(cat "$WORK/calls.txt")"
          [ ! -s "$WORK/alert-reads.txt" ] || fail "Expected no alert to be read without code scanning"

          # The same reply and comment already there: nothing is written or waited for.
          jq -n --argjson b "$THREAD" --arg r "$REPLY" --arg o "$OWN" \
            '[$b, {id: 950, in_reply_to_id: 900, path: "main.bal", line: 5, body: $r}, {id: 951, in_reply_to_id: null, path: "main.bal", line: 5, body: $o}]' \
            > "$WORK/comments.json"
          BOT_TIMEOUT=60 run
          [ ! -s "$WORK/calls.txt" ] || fail "Expected no change, got: $(cat "$WORK/calls.txt")"

          # A changed reply keeps its form, and a current comment whose finding is no longer suppressed
          # says so. An outdated one, without a line, is left alone.
          jq -n --argjson b "$THREAD" --arg m1 "$M1" --arg o "$OWN" '[$b,
            {id: 950, in_reply_to_id: 900, path: "main.bal", line: 5, body: "\($m1)\nold"},
            {id: 951, in_reply_to_id: null, path: "main.bal", line: 5, body: $o},
            {id: 952, in_reply_to_id: null, path: "main.bal", line: 3, body: "<!-- scan-ballerina:suppression:bal-scan:ballerina:3 -->\nold"},
            {id: 953, in_reply_to_id: null, path: "main.bal", line: null, body: "<!-- scan-ballerina:suppression:bal-scan:ballerina:3 -->\nold"}]' \
            > "$WORK/comments.json"
          run
          [ "$(sort "$WORK/calls.txt" | paste -sd ' ')" = "PATCH https://api.github.com/repos/owner/repo/pulls/comments/950 PATCH https://api.github.com/repos/owner/repo/pulls/comments/952" ] \
            || fail "Expected comments 950 and 952 to be edited, got: $(cat "$WORK/calls.txt")"
          [ "$(payload /comments/950)" = "$REPLY" ] || fail "Expected 950 to stay a reply, got: $(payload /comments/950)"
          [ "$(payload /comments/952)" = "$(printf '%s\n%s' '<!-- scan-ballerina:suppression:bal-scan:ballerina:3 -->' 'This finding is no longer suppressed, as of 0123456.')" ] \
            || fail "Expected 952 to say it is no longer suppressed, got: $(payload /comments/952)"

          # A newer push: its own run comments.
          echo '{"head": {"sha": "fedcba9876543210"}}' > "$WORK/pr.json"
          run
          [ ! -s "$WORK/calls.txt" ] || fail "Expected no comment for an older head, got: $(cat "$WORK/calls.txt")"
          echo '{"head": {"sha": "0123456789abcdef"}}' > "$WORK/pr.json"

          # A response that cannot be read warns, and comments nothing.
          echo 'not json' > "$WORK/comments.json"
          run
          [ ! -s "$WORK/calls.txt" ] || fail "Expected no comment on a bad response, got: $(cat "$WORK/calls.txt")"
          grep -q '^::warning.*Could not read the changes and comments of pull request #7' "$WORK/log.txt" \
            || fail "Expected a warning, got: $(cat "$WORK/log.txt")"

          # Each annotation the pull request adds or removes for findings already on the base gets a
          # comment at its line: an added one on the head's side, a removed one on its deleted line.
          # x:1 is added above existing code, at line 2, which the merge commit moved to 4. y:1 is
          # removed from line 3 of the base. z:1 is added with its code, which code scanning shows,
          # so its finding gets the usual comment instead. w:1 is removed with its finding.
          printf '%s\n' 'function a() {}' '@scan:Suppress {rules: ["x:1"], reason: "Ok"}' 'function b() {' 'function c() {' '}' \
            '@scan:Suppress {rules: ["z:1"]}' 'function d() {}' > "$WORK/repo/svc.bal"
          jq -n '[{filename: "svc.bal", patch: "@@ -1,5 +1,7 @@\n function a() {}\n+@scan:Suppress {rules: [\"x:1\"], reason: \"Ok\"}\n function b() {\n-@scan:Suppress {rules: [\"y:1\"]}\n function c() {\n }\n+@scan:Suppress {rules: [\"z:1\"]}\n+function d() {}"}]' \
            > "$WORK/files.json"
          jq -n '[
            {severity: "low", rule: "x:1", message: "Old <code>", file: "svc.bal", line: 3, suppressed: true, justification: "Ok"},
            {severity: "high", rule: "y:1", message: "Unchecked", file: "svc.bal", line: 4, suppressed: false, justification: ""},
            {severity: "low", rule: "z:1", message: "New", file: "svc.bal", line: 7, suppressed: true, justification: ""}]' \
            > "$WORK/results.json"
          jq -n '{branch: "main", head: "1111111", base: "2222222",
            added: [{file: "svc.bal", line: 4, text: "@scan:Suppress {rules: [\"x:1\"], reason: \"Ok\"}"},
              {file: "svc.bal", line: 6, text: "@scan:Suppress {rules: [\"z:1\"]}"}],
            removed: [{file: "svc.bal", line: 3, "base-line": 3, text: "@scan:Suppress {rules: [\"y:1\"]}"},
              {file: "svc.bal", line: 5, "base-line": 9, text: "@scan:Suppress {rules: [\"w:1\"]}"}]}' \
            > "$WORK/suppression-changes.json"
          jq -n '[]' > "$WORK/comments.json"
          run
          [ "$(grep -c '^POST https://api.github.com/repos/owner/repo/pulls/7/comments$' "$WORK/calls.txt")" -eq 3 ] \
            && [ "$(wc -l < "$WORK/calls.txt")" -eq 3 ] || fail "Expected three comments, got: $(cat "$WORK/calls.txt")"
          ADDED="$(jq -sr '.[] | select(.path == "svc.bal" and .line == 2 and .side == "RIGHT") | .body' "$WORK/payloads.jsonl")"
          REMOVED="$(jq -sr '.[] | select(.path == "svc.bal" and .line == 3 and .side == "LEFT") | .body' "$WORK/payloads.jsonl")"
          NEW="$(jq -sr '.[] | select(.path == "svc.bal" and .line == 7 and .side == "RIGHT") | .body' "$WORK/payloads.jsonl")"
          [ "$(head -n1 <<< "$ADDED")" = '<!-- scan-ballerina:suppression-change:bal-scan:added -->' ] \
            || fail "Expected a comment at the added x:1 annotation, got: $(cat "$WORK/payloads.jsonl")"
          [ "$(tail -n +2 <<< "$ADDED")" = "$(printf '%s\n' '**New suppression added**' '' '**Rule:** `x:1`' '' '**Reason:** Ok' '' '_Its alert stays open until the merge, when the action dismisses it._')" ] \
            || fail "Unexpected comment at the added annotation: $ADDED"
          [ "$(head -n1 <<< "$REMOVED")" = '<!-- scan-ballerina:suppression-change:bal-scan:removed -->' ] \
            || fail "Expected a comment at the removed y:1 annotation, got: $(cat "$WORK/payloads.jsonl")"
          grep -qxF '**Suppression removed**' <<< "$REMOVED" && grep -qxF '**Rule:** `y:1`' <<< "$REMOVED" \
            && grep -qxF '**Reason:** _No reason given_' <<< "$REMOVED" \
            && grep -qxF '_Its alert stays dismissed until the merge, when the action reopens it._' <<< "$REMOVED" \
            || fail "Unexpected comment at the removed annotation: $REMOVED"
          [ "$(head -n1 <<< "$NEW")" = '<!-- scan-ballerina:suppression:bal-scan:z:1 -->' ] \
            || fail "Expected the usual comment for the new z:1 finding, got: $(cat "$WORK/payloads.jsonl")"
          ! grep -q '/issues/' "$WORK/calls.txt" || fail "Expected no comment in the conversation, got: $(cat "$WORK/calls.txt")"
          # The same comments already there: nothing is written.
          jq -n --arg a "$ADDED" --arg r "$REMOVED" --arg n "$NEW" '[
            {id: 960, in_reply_to_id: null, path: "svc.bal", line: 2, side: "RIGHT", body: $a},
            {id: 961, in_reply_to_id: null, path: "svc.bal", line: 3, side: "LEFT", body: $r},
            {id: 962, in_reply_to_id: null, path: "svc.bal", line: 7, side: "RIGHT", body: $n}]' > "$WORK/comments.json"
          run
          [ ! -s "$WORK/calls.txt" ] || fail "Expected no change, got: $(cat "$WORK/calls.txt")"
          # The pull request no longer removes y:1: its comment says so.
          jq '.removed = []' "$WORK/suppression-changes.json" > "$WORK/changes.tmp"
          mv "$WORK/changes.tmp" "$WORK/suppression-changes.json"
          run
          [ "$(cat "$WORK/calls.txt")" = "PATCH https://api.github.com/repos/owner/repo/pulls/comments/961" ] \
            || fail "Expected comment 961 to be edited, got: $(cat "$WORK/calls.txt")"
          [ "$(payload /comments/961)" = "$(printf '%s\n%s' '<!-- scan-ballerina:suppression-change:bal-scan:removed -->' 'This suppression change no longer applies, as of 0123456.')" ] \
            || fail "Expected 961 to say it no longer applies, got: $(payload /comments/961)"

  # The supported scan tools are 0.13.0 and later, and the 0.11.x backport of its features from
  # 0.11.1 for Ballerina 2201.12.x. 0.12.x has neither suppressions nor --exclude-tests.
  scan-tool-support:
    name: Scan tool support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the supported scan tools
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          source scripts/lib.sh
          for v in 0.11.1 0.11.2 0.13.0 0.13.1 0.14.0 1.0.0; do
            tool_supported "$v" || fail "bal scan $v must be supported"
          done
          for v in 0.10.0 0.11.0 0.11.1-alpha 0.12.0-rc1 0.12.0 0.12.5 0.13.0-alpha; do
            ! tool_supported "$v" || fail "bal scan $v must not be supported"
          done
          [ "$MIN_TOOL_VERSION $MIN_BALLERINA_VERSION" = "0.11.1 2201.12.0" ] || fail "The oldest supported pair is $MIN_TOOL_VERSION and $MIN_BALLERINA_VERSION"
          [ "$NEWEST_LINE_TOOL_VERSION $NEWEST_LINE_BALLERINA_VERSION" = "0.13.0 2201.13.0" ] \
            || fail "The newest line is $NEWEST_LINE_TOOL_VERSION on $NEWEST_LINE_BALLERINA_VERSION"
          for pair in 0.11.1:2201.12.0 0.11.5:2201.12.0 0.13.0:2201.13.0 0.14.0:2201.13.0; do
            [ "$(known_tool_min_ballerina "${pair%%:*}")" = "${pair#*:}" ] \
              || fail "bal scan ${pair%%:*} must need Ballerina ${pair#*:}, got $(known_tool_min_ballerina "${pair%%:*}")"
          done
          for pair in 0.3.0:0.11.1:supported 0.3.0:0.13.0:supported 0.3.0:0.11.0:too-old 0.3.0:0.14.0:untested; do
            IFS=: read -r plugin tool expected <<< "$pair"
            [ "$(sonar_plugin_support "$plugin" "$tool")" = "$expected" ] \
              || fail "Plugin $plugin with bal scan $tool must be $expected, got $(sonar_plugin_support "$plugin" "$tool")"
          done

      - name: Check the unsupported tool-version error
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/tool-version"
          mkdir -p "$WORK"
          for v in 0.11.0 0.12.0; do
            ! GITHUB_OUTPUT=/dev/null TOOL_VERSION="$v" CATEGORY="tool-$v" bash scripts/validate.sh > "$WORK/$v.log" \
              || fail "tool-version $v must be rejected"
            grep -q "tool-version is $v, which is not supported" "$WORK/$v.log" || fail "No error for tool-version $v: $(cat "$WORK/$v.log")"
          done
          for v in 0.11.1 0.13.0; do
            GITHUB_OUTPUT=/dev/null TOOL_VERSION="$v" CATEGORY="tool-$v" bash scripts/validate.sh > "$WORK/$v.log" \
              || fail "tool-version $v must be accepted: $(cat "$WORK/$v.log")"
          done

      - name: Check the suppressions input and the default branch
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/suppression-input"
          mkdir -p "$WORK"
          echo '{"repository": {"full_name": "owner/repo", "default_branch": "main"}}' > "$WORK/event.json"
          # Usage: run NAME SUPPRESSIONS GITHUB_REF [GITHUB_EVENT_NAME]
          run() {
            : > "$WORK/$1.txt"
            GITHUB_EVENT_NAME="${4:-push}" GITHUB_EVENT_PATH="$WORK/event.json" GITHUB_REF="$3" GITHUB_OUTPUT="$WORK/$1.txt" \
              SUPPRESSIONS="$2" CATEGORY="$1" bash scripts/validate.sh > "$WORK/$1.log"
          }
          for value in '' true false; do
            run "value-$value" "$value" refs/heads/main || fail "suppressions '$value' must be accepted"
          done
          ! run invalid maybe refs/heads/main || fail "suppressions 'maybe' must be rejected"
          grep -q "suppressions must be 'true' or 'false'" "$WORK/invalid.log" || fail "No error for suppressions 'maybe'"
          grep -qx default-branch=true "$WORK/value-.txt" || fail "refs/heads/main is the default branch"
          run feature '' refs/heads/feature || fail "validate.sh failed on a feature branch"
          grep -qx default-branch=false "$WORK/feature.txt" || fail "refs/heads/feature is not the default branch"
          for event in pull_request_target workflow_run; do
            run "$event" '' refs/heads/main "$event" || fail "validate.sh failed on $event"
            grep -qx default-branch=false "$WORK/$event.txt" || fail "$event must not count as the default branch"
          done
          # A scheduled run's payload has no repository object.
          echo '{"schedule": "0 0 * * *"}' > "$WORK/schedule-event.json"
          : > "$WORK/schedule.txt"
          GITHUB_EVENT_NAME=schedule GITHUB_EVENT_PATH="$WORK/schedule-event.json" GITHUB_REF=refs/heads/main \
            GITHUB_OUTPUT="$WORK/schedule.txt" CATEGORY=schedule bash scripts/validate.sh > "$WORK/schedule.log" \
            || fail "validate.sh failed on schedule"
          grep -qx default-branch=true "$WORK/schedule.txt" || fail "schedule must count as the default branch"
          for event in push schedule workflow_dispatch merge_group pull_request pull_request_review pull_request_review_comment; do
            run "save-$event" '' refs/heads/main "$event" || fail "validate.sh failed on $event"
            grep -qx save-cache=true "$WORK/save-$event.txt" || fail "$event must save the SonarScanner cache"
          done
          for event in pull_request_target workflow_run issue_comment repository_dispatch; do
            run "save-$event" '' refs/heads/main "$event" || fail "validate.sh failed on $event"
            grep -qx save-cache=false "$WORK/save-$event.txt" || fail "$event must not save the SonarScanner cache"
          done

      # Unsupported platforms fail the step and unselected ones only warn. A selected platform whose
      # settings are missing or do not follow its schema fails the step, except that a restricted run
      # skips sonarqube.
      - name: Check the platforms and platform-config validation
        shell: bash
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          WORK="$RUNNER_TEMP/platform-validation"
          mkdir -p "$WORK"
          SONAR_OK=$'sonarqube:\n  host-url: https://sonar.example.com\n  token: abc'
          # Usage: [ACTOR=...] check NAME PLATFORMS PLATFORM_CONFIG pass|fail [KIND MESSAGE]
          # A push by ACTOR, so that a pull request from a fork running this test is not a restricted run.
          check() {
            local status=0
            GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH=/dev/null GITHUB_ACTOR="${ACTOR:-octocat}" \
              GITHUB_OUTPUT=/dev/null PLATFORMS="$2" PLATFORM_CONFIG="$3" CATEGORY="$1" \
              bash scripts/validate.sh > "$WORK/$1.log" || status=$?
            if [ "$4" = pass ] && [ "$status" -ne 0 ]; then
              fail "$1: must pass: $(cat "$WORK/$1.log")"
            elif [ "$4" = fail ] && [ "$status" -eq 0 ]; then
              fail "$1: must fail"
            fi
            if [ "$#" -ge 6 ] && ! grep -q "^::$5 .*$6" "$WORK/$1.log"; then
              fail "$1: no $5 containing: $6. Got: $(cat "$WORK/$1.log")"
            fi
            echo "$1: checked"
          }
          check unknown-platform 'github-code-scanning, foo' '' fail error "platforms has 'foo', which is not a supported platform"
          check unknown-config-key github-code-scanning $'foo:\n  a: 1' fail error "platform-config has settings for 'foo', which is not a supported platform"
          check unselected-sonarqube github-code-scanning $'sonarqube:\n  tokn: x' pass warning "platform-config has settings for 'sonarqube', which is not in platforms"
          check unselected-gcs sonarqube $'github-code-scanning:\n  a: 1\n'"$SONAR_OK" pass warning "platform-config has settings for 'github-code-scanning', which is not in platforms"
          check gcs-empty github-code-scanning 'github-code-scanning: {}' pass
          check gcs-settings github-code-scanning $'github-code-scanning:\n  a: 1' fail error "platform-config.github-code-scanning takes no settings"
          check sonarqube-missing sonarqube '' fail error "sonarqube is in platforms, but platform-config has no settings for it"
          check sonarqube-null sonarqube 'sonarqube:' fail error "sonarqube is in platforms, but platform-config has no settings for it"
          # A platform-config passed whole from a secret is empty in a Dependabot run.
          ACTOR='dependabot[bot]' check sonarqube-missing-restricted sonarqube '' pass warning "Skipping sonarqube"
          check sonarqube-unknown-field sonarqube $'sonarqube:\n  tokn: x' fail error 'platform-config.sonarqube has an unknown field "tokn"'
          check sonarqube-ok sonarqube "$SONAR_OK" pass
          check not-a-mapping '' 'foo' fail error "platform-config must be a mapping keyed by platform"
          [ "$FAILURES" -eq 0 ] || exit 1

      # bal scan leaves out the test sources and applies the suppressions itself, and its gate is
      # turned off, since report.sh applies the action's gate.
      - name: Check the arguments of bal scan
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/scan-arguments"
          mkdir -p "$WORK/bin" "$WORK/reports" "$WORK/logs"
          # A fake bal that records its arguments, one per line, and writes an empty SARIF report.
          cat > "$WORK/bin/bal" << 'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$@" >> "$ARGS_FILE"
          mkdir -p target/report
          echo '{"version": "2.1.0", "runs": [{"tool": {"driver": {"name": "Ballerina Scan Tool"}}, "results": []}]}' > target/report/scan_results.sarif
          EOF
          chmod +x "$WORK/bin/bal"
          # test/restore/sonarqube-failure has a sonarqube [[platform]] entry, which the SARIF scan leaves as it is.
          jq -n '[{path: "test/restore/sonarqube-failure", kind: "package", members: [],
            "scan-config": [{path: "test/restore/sonarqube-failure", table: false, config: "", url: "",
              "scan-toml": "test/restore/sonarqube-failure/Scan.toml"}]}]' > "$WORK/units.json"
          BEFORE="$(sha256sum test/restore/sonarqube-failure/Scan.toml)"
          # Usage: scan NAME EXCLUDE_TESTS SUPPRESSIONS
          scan() {
            : > "$WORK/$1.args"
            PATH="$WORK/bin:$PATH" ARGS_FILE="$WORK/$1.args" SCAN_WORK_DIR="$WORK" GITHUB_OUTPUT=/dev/null \
              SCAN_TOOL_VERSION=0.13.0 EXCLUDE_TESTS="$2" SUPPRESSIONS="$3" CATEGORY="$1" bash scripts/scan.sh > "$WORK/$1.log" \
              || fail "$1: scan.sh failed: $(cat "$WORK/$1.log")"
            ! grep -q '^::warning' "$WORK/$1.log" || fail "$1: unexpected warning: $(grep '^::warning' "$WORK/$1.log")"
            grep -qx -- --format=sarif "$WORK/$1.args" || fail "$1: did not pass --format=sarif"
            grep -qx -- --fail-on-severity=NONE "$WORK/$1.args" || fail "$1: did not turn the gate of bal scan off"
          }
          args() { paste -sd ' ' "$WORK/$1.args"; }

          scan defaults '' ''
          grep -qx -- --exclude-tests=true "$WORK/defaults.args" || fail "defaults: expected --exclude-tests=true, got $(args defaults)"
          ! grep -q -- --ignore-suppressions "$WORK/defaults.args" || fail "defaults: passed --ignore-suppressions"
          scan with-tests false true
          grep -qx -- --exclude-tests=false "$WORK/with-tests.args" || fail "with-tests: expected --exclude-tests=false, got $(args with-tests)"
          scan ignored true false
          grep -qx -- --ignore-suppressions "$WORK/ignored.args" || fail "ignored: did not pass --ignore-suppressions"

          [ "$(sha256sum test/restore/sonarqube-failure/Scan.toml)" = "$BEFORE" ] || fail "The SARIF scan must leave Scan.toml as it is"
          [ -z "$(git status --porcelain -- test)" ] || fail "The scans left changes in test: $(git status --porcelain -- test)"

  # sonar-cache.sh drops the plugin folders the scan did not read before the cache is saved. The
  # cache is faked, and reading a file stands in for SonarScanner loading it.
  sonar-cache-pruning:
    name: SonarScanner cache pruning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that only unread plugin folders are dropped
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          source scripts/lib.sh
          # Usage: setup NAME; creates a work directory and a cache with a read plugin (used), an
          # unread plugin (old) and its unzipped copy, and an unread JRE archive (jre).
          setup() {
            WORK="$RUNNER_TEMP/prune-$1"
            HOME_DIR="$WORK/home"
            mkdir -p "$HOME_DIR/cache/used" "$HOME_DIR/cache/old" "$HOME_DIR/cache/jre" "$HOME_DIR/cache/_unzip/old.jar_unzip"
            echo a > "$HOME_DIR/cache/used/used.jar"
            echo b > "$HOME_DIR/cache/old/old.jar"
            echo c > "$HOME_DIR/cache/jre/jre.tar.gz"
            echo d > "$HOME_DIR/cache/_unzip/old.jar_unzip/plugin.class"
            touch -d '2 days ago' "$HOME_DIR"/cache/*/* "$HOME_DIR/cache/_unzip/old.jar_unzip/plugin.class"
            : > "$WORK/sonarqube-failures.txt"
            jq -n --arg home "$HOME_DIR" '[{slot: 1, url: "https://sonar.example.com", home: $home, prefix: "test-"}]' \
              > "$WORK/sonar-caches.json"
            mark_sonar_cache "$HOME_DIR/cache" "$HOME_DIR/cache-start"
            sleep 1
          }
          run() {
            GITHUB_OUTPUT=/dev/null SCAN_WORK_DIR="$WORK" SCAN_SUCCEEDED="$1" RESTORED_KEY_1=test-old \
              bash scripts/sonar-cache.sh
          }

          setup pruned
          cat "$HOME_DIR/cache/used/used.jar" > /dev/null
          run true
          [ -f "$HOME_DIR/cache/used/used.jar" ] || fail "A plugin the scan read must be kept"
          [ -f "$HOME_DIR/cache/jre/jre.tar.gz" ] || fail "The JRE archive must be kept"
          [ ! -e "$HOME_DIR/cache/old" ] || fail "A plugin the scan did not read must be dropped"
          [ ! -e "$HOME_DIR/cache/_unzip/old.jar_unzip" ] || fail "The unzipped copy of a dropped plugin must be dropped"

          # Nothing read: access times are not tracked, so nothing is dropped.
          setup untracked
          run true
          [ -e "$HOME_DIR/cache/old" ] || fail "Nothing must be dropped when no restored file was read"

          setup failed
          cat "$HOME_DIR/cache/used/used.jar" > /dev/null
          run false
          [ -e "$HOME_DIR/cache/old" ] || fail "Nothing must be dropped after a failed scan"

          # An earlier use of the action in the job unzipped the plugin, so the scan loaded it from
          # the copy without reading the JAR.
          setup unzipped
          cat "$HOME_DIR/cache/used/used.jar" "$HOME_DIR/cache/_unzip/old.jar_unzip/plugin.class" > /dev/null
          run true
          [ -e "$HOME_DIR/cache/old" ] || fail "A plugin loaded from its unzipped copy must be kept"

      # Each server has its own SONAR_USER_HOME and cache key, so a job that shares one server with
      # another job shares its cache, whatever other servers either uses.
      - name: Check that each server is keyed apart
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/per-server"
          mkdir -p "$WORK/a/cache/x" "$WORK/b/cache/y"
          echo a > "$WORK/a/cache/x/a.jar"
          echo b > "$WORK/b/cache/y/b.jar"
          jq -n --arg w "$WORK" '[
            {slot: 1, url: "https://a.example.com", home: "\($w)/a", prefix: "test-a-"},
            {slot: 2, url: "https://b.example.com", home: "\($w)/b", prefix: "test-b-"}]' > "$WORK/sonar-caches.json"
          : > "$WORK/out.txt"
          GITHUB_OUTPUT="$WORK/out.txt" SCAN_WORK_DIR="$WORK" SCAN_SUCCEEDED=true RESTORED_KEY_2=test-b-old \
            bash scripts/sonar-cache.sh
          grep -q '^key-1=test-a-' "$WORK/out.txt" && grep -q '^key-2=test-b-' "$WORK/out.txt" \
            || fail "Each server must get a key with its own prefix: $(cat "$WORK/out.txt")"
          grep -qx save-1=true "$WORK/out.txt" && grep -qx save-2=true "$WORK/out.txt" \
            || fail "Both caches changed, so both must be saved: $(cat "$WORK/out.txt")"
          KEY_1="$(grep '^key-1=' "$WORK/out.txt" | cut -d= -f2)"
          GITHUB_OUTPUT=/dev/null SCAN_WORK_DIR="$WORK" RECORD=true SAVED_KEY_1="$KEY_1" bash scripts/sonar-cache.sh
          [ "$(cat "$WORK/a/cache-key")" = "$KEY_1" ] || fail "The saved key of server 1 must be recorded in its home"
          [ ! -e "$WORK/b/cache-key" ] || fail "Server 2 was not saved, so no key must be recorded for it"

  # test/toml holds Scan.toml files with comments, inline tables, indented and spaced headers,
  # tabs and sub-tables, and the forms of [[platform]] entries the action must reject before scanning.
  toml-editing:
    name: Scan.toml editing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the golden files
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib.sh
          diff -u test/toml/expected/mixed.sonarqube.toml <(drop_sonarqube_platform < test/toml/mixed.toml)
          # The edited file must still be valid TOML, with the other entry left.
          [ "$(drop_sonarqube_platform < test/toml/mixed.toml | yq -p toml -o json -I0 '[.platform[].name]')" = '["other"]' ]
          sonarqube_entry_replaceable test/toml/mixed.toml
          # set -e ignores a failing "! command", so each rejection is checked explicitly.
          for f in inline-array inline-array-other multiline-string; do
            if sonarqube_entry_replaceable "test/toml/$f.toml"; then
              echo "::error::test/toml/$f.toml must be rejected"
              exit 1
            fi
          done

      # A member scanned on its own, with no Scan.toml, gets the workspace's Scan.toml as the base of
      # the one the SonarQube scan writes.
      - name: Find the workspace of a member
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          source scripts/lib.sh
          [ "$(enclosing_workspace test/projects/workspace/billing)" = test/projects/workspace ] \
            || fail "billing is a member of test/projects/workspace"
          if enclosing_workspace test/projects/single > /dev/null; then fail "test/projects/single is in no workspace"; fi
          INFO="$(SCAN_WORK_DIR="$RUNNER_TEMP/members" SCAN_PATHS=test/projects/workspace/billing GITHUB_OUTPUT=/dev/null \
            bash -c 'mkdir -p "$SCAN_WORK_DIR" && bash scripts/find-packages.sh > /dev/null && cat "$SCAN_WORK_DIR/units.json"')"
          jq -e '.[0]."scan-config"[0]."workspace-scan-toml" == "test/projects/workspace/Scan.toml"' <<< "$INFO" > /dev/null \
            || fail "The member must keep the workspace Scan.toml: $INFO"

  # validate.sh tells restricted runs, those with a read-only GITHUB_TOKEN and no secrets, from the
  # event, the actor and the event file. Each case fakes them as GitHub sets them for that run.
  restricted-runs:
    name: Restricted runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the uploads kept for each kind of run
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # Usage: check NAME EVENT ACTOR HEAD-REPO PLATFORMS PLATFORM-CONFIG OUTPUT...
          # An empty HEAD-REPO leaves pull_request out of the event file, as on a push.
          check() {
            local name="$1" event="$2" actor="$3" head="$4" platforms="$5" config="$6"
            shift 6
            local work="$RUNNER_TEMP/restricted-runs/$name" expected
            mkdir -p "$work"
            jq -n --arg head "$head" '{repository: {full_name: "owner/repo"}}
              + if $head == "" then {} else {pull_request: {head: {repo: {full_name: $head}}}} end' \
              > "$work/event.json"
            : > "$work/output.txt"
            # The commands go to a file, so that the warnings do not annotate this job.
            GITHUB_EVENT_NAME="$event" GITHUB_ACTOR="$actor" GITHUB_EVENT_PATH="$work/event.json" \
              GITHUB_OUTPUT="$work/output.txt" PLATFORMS="$platforms" PLATFORM_CONFIG="$config" \
              CATEGORY="$name" bash scripts/validate.sh > "$work/stdout.txt" \
              || fail "$name: validate.sh failed: $(cat "$work/stdout.txt")"
            for expected in "$@"; do
              grep -qxF "$expected" "$work/output.txt" \
                || fail "$name: expected $expected, got $(grep -E '^(github-code-scanning|restricted|sonarqube)' "$work/output.txt" | paste -sd ' ')"
            done
            echo "$name: ok"
          }

          # Every run tries the upload. Restricted runs on events other than pull_request let it fail,
          # and report it as skipped.
          RESTRICTED=(github-code-scanning=true restricted=true)
          TRUSTED=(github-code-scanning=true restricted=false)
          check fork-pr pull_request contributor contributor/repo github-code-scanning '' "${RESTRICTED[@]}"
          check fork-pr-review pull_request_review contributor contributor/repo github-code-scanning '' "${RESTRICTED[@]}"
          check fork-pr-review-comment pull_request_review_comment contributor contributor/repo github-code-scanning '' "${RESTRICTED[@]}"
          check dependabot-pr pull_request 'dependabot[bot]' owner/repo github-code-scanning '' "${RESTRICTED[@]}"
          check dependabot-push push 'dependabot[bot]' '' github-code-scanning '' "${RESTRICTED[@]}"
          check dependabot-schedule schedule 'dependabot[bot]' '' github-code-scanning '' "${RESTRICTED[@]}"
          check dependabot-dispatch workflow_dispatch 'dependabot[bot]' '' github-code-scanning '' "${RESTRICTED[@]}"
          check same-repo-pr pull_request owner owner/repo github-code-scanning '' "${TRUSTED[@]}"
          check fork-pr-target pull_request_target contributor contributor/repo github-code-scanning '' "${TRUSTED[@]}"

          # validate.sh no longer warns about the upload; report.sh does, only when it was skipped.
          for name in fork-pr fork-pr-review fork-pr-review-comment dependabot-pr dependabot-push \
            dependabot-schedule dependabot-dispatch same-repo-pr fork-pr-target; do
            ! grep -q '^::warning' "$RUNNER_TEMP/restricted-runs/$name/stdout.txt" \
              || fail "$name: validate.sh warned: $(grep '^::warning' "$RUNNER_TEMP/restricted-runs/$name/stdout.txt")"
          done

          # Pull requests from forks still get no secrets, so an empty SonarQube token skips it.
          SONAR_EMPTY_TOKEN=$'sonarqube:\n  host-url: https://sonar.example.com\n  token: ""'
          check fork-pr-sonarqube pull_request contributor contributor/repo sonarqube "$SONAR_EMPTY_TOKEN" \
            sonarqube=false sonarqube-skipped=true

      - name: Check the warning for a skipped upload to code scanning
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/gcs-skipped"
          mkdir -p "$WORK"
          # The commands go to a file, so that the warning does not annotate this job.
          for skipped in true false; do
            GITHUB_OUTPUT=/dev/null GITHUB_STEP_SUMMARY="$WORK/summary-$skipped.md" CATEGORY=gcs-skipped \
              UNIT_COUNT=1 HIGH=0 MEDIUM=0 LOW=0 TOTAL=0 PACKAGES_SCANNED=1 GCS_SKIPPED="$skipped" \
              bash scripts/report.sh > "$WORK/stdout-$skipped.txt"
          done
          grep -q '^::warning.*upload to GitHub code scanning failed and was skipped' "$WORK/stdout-true.txt" \
            || fail "No warning when the upload was skipped"
          grep -q 'upload to GitHub code scanning failed and was skipped' "$WORK/summary-true.md" \
            || fail "No summary line when the upload was skipped"
          ! grep -q 'code scanning' "$WORK/stdout-false.txt" || fail "Warned although the upload was not skipped"
          ! grep -q 'code scanning' "$WORK/summary-false.md" || fail "Summary mentions code scanning although the upload was not skipped"
