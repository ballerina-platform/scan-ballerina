name: Scripts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # test/annotations/findings.json has a finding without a rule, a message with a newline and a tab,
  # a file name with "," and ":", a finding without a file and a message that looks like a workflow
  # command. The annotation commands must match test/annotations/expected.txt.
  annotation-commands:
    name: Annotation commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write the annotations and compare with the golden file
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/annotation-commands"
          mkdir -p "$WORK"
          cp test/annotations/findings.json "$WORK/"
          : > "$WORK/sonarqube-failures.txt"
          # The commands go to a file, so that they do not annotate this job.
          SCAN_WORK_DIR="$WORK" CATEGORY=annotations ANNOTATIONS=true JOB_SUMMARY=false \
            HIGH=1 MEDIUM=1 LOW=2 TOTAL=4 PACKAGES_SCANNED=1 bash scripts/report.sh > "$WORK/stdout.txt"
          diff -u test/annotations/expected.txt <(grep '^::' "$WORK/stdout.txt")

  # test/sarif holds three bal scan reports: of a package whose path has a space and of a
  # workspace, with run.artifacts, artifact indexes, a test file, a '#' in a file name and a
  # backslash in a URI, and of a package whose results name their rule by rule.id, rule.index or
  # ruleIndex only, or not at all. The merged file must match test/sarif/expected.sarif.
  sarif-golden:
    name: SARIF merging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Merge the reports and compare with the golden files
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sarif-golden"
          mkdir -p "$WORK"
          cp -r test/sarif/units.json test/sarif/reports "$WORK/"
          SCAN_WORK_DIR="$WORK" EXCLUDE_TESTS=true EXCLUDE_PATHS= CATEGORY=golden bash scripts/merge-sarif.sh
          diff -u test/sarif/expected.sarif <(jq -S . "$WORK/golden.sarif")
          diff -u test/sarif/expected-findings.json <(jq -S . "$WORK/findings.json")

      # test/sarif/legacy holds a report of bal scan 0.11.0, which sets no rule kind, help or full
      # description, and takes each rule's level from its kind.
      - name: Merge a bal scan 0.11.0 report
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$RUNNER_TEMP/sarif-legacy"
          mkdir -p "$WORK"
          cp -r test/sarif/legacy/units.json test/sarif/legacy/reports "$WORK/"
          SCAN_WORK_DIR="$WORK" EXCLUDE_TESTS=true EXCLUDE_PATHS= CATEGORY=legacy bash scripts/merge-sarif.sh
          RULES="$(jq -c '.runs[0].tool.driver.rules | map({key: .id, value: [.properties.ruleKind, (.properties.tags // [])]}) | from_entries' "$WORK/legacy.sarif")"
          [ "$RULES" = '{"ballerina/example:1":["VULNERABILITY",["security"]],"ballerina/example:2":["BUG",[]],"ballerina:1":["CODE_SMELL",["maintainability"]]}' ] \
            || fail "Each rule's kind must be taken from its level: $RULES"
          jq -e '.runs[0].tool.driver.rules | all(.help.markdown | contains("- **Type:** "))' "$WORK/legacy.sarif" > /dev/null \
            || fail "Each rule's help must name its type"
          [ "$(jq -c '[.[] | .severity]' "$WORK/findings.json")" = '["low","medium","high"]' ] \
            || fail "The severities must follow the levels: $(jq -c . "$WORK/findings.json")"

      - name: Validate the merged file against the SARIF 2.1.0 schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sarif-schema.json" https://json.schemastore.org/sarif-2.1.0.json
          pipx run check-jsonschema --schemafile "$RUNNER_TEMP/sarif-schema.json" "$RUNNER_TEMP/sarif-golden/golden.sarif"

  # test/toml holds Scan.toml files with comments, inline tables, indented and spaced headers,
  # tabs and sub-tables, and two forms the action must reject before scanning.
  toml-editing:
    name: Scan.toml editing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the golden files
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib.sh
          diff -u test/toml/expected/mixed.all.toml <(drop_platforms all < test/toml/mixed.toml)
          diff -u test/toml/expected/mixed.sonarqube.toml <(drop_platforms sonarqube < test/toml/mixed.toml)
          # The edited files must still be valid TOML, with the right entries left.
          [ "$(drop_platforms all < test/toml/mixed.toml | yq -p toml -o json '.platform // [] | length')" = 0 ]
          [ "$(drop_platforms sonarqube < test/toml/mixed.toml | yq -p toml -o json -I0 '[.platform[].name]')" = '["other"]' ]
          [ -z "$(platform_form_problem test/toml/mixed.toml mixed)" ]
          platform_form_problem test/toml/inline-array.toml inline | grep -q 'such as an array of inline tables'
          platform_form_problem test/toml/multiline-string.toml multiline | grep -q 'without breaking the file'
