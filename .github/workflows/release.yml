name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  major-tag:
    name: Move the major version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Pre-release suffixes such as v1.0.0-rc.1 are skipped, so they never move the major tag.
      - name: Point the major tag at the release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Release tag '$TAG' is not vX.Y.Z, so no major tag was moved."
            exit 0
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $TAG ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
