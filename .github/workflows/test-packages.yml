name: Packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  single-path:
    name: One path with several packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          category: single-path
          artifacts: true

      - name: Check that only the given path was scanned
        shell: bash
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$PACKAGES" = 2 ] || fail "packages-scanned is '$PACKAGES', expected 2"
          URIS="$(jq -c '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]' "$SARIF_FILE")"
          jq -e 'length > 0 and all(startswith("test/projects/multi/"))' <<< "$URIS" > /dev/null \
            || fail "Every finding must be under test/projects/multi: $URIS"
          jq -e 'any(startswith("test/projects/multi/orders/")) and any(startswith("test/projects/multi/payments/"))' \
            <<< "$URIS" > /dev/null || fail "Both packages under test/projects/multi must be scanned: $URIS"

  exclude-paths:
    name: Several paths with a package excluded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: |
            test/projects/multi
            test/projects/services
          exclude-paths: test/projects/services/internal/legacy
          category: exclude-paths
          artifacts: true

      - name: Check that the excluded package was not scanned
        shell: bash
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$PACKAGES" = 3 ] || fail "packages-scanned is '$PACKAGES', expected 3"
          URIS="$(jq -c '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]' "$SARIF_FILE")"
          jq -e 'any(startswith("test/projects/services/internal/")) | not' <<< "$URIS" > /dev/null \
            || fail "Findings in the excluded package must be dropped: $URIS"
          jq -e 'any(startswith("test/projects/multi/orders/")) and any(startswith("test/projects/multi/payments/"))
              and any(startswith("test/projects/services/api/"))' <<< "$URIS" > /dev/null \
            || fail "The packages that are not excluded must be scanned: $URIS"

  # bal scan writes one report for the whole workspace to <workspace>/target/report. The members have
  # no Scan.toml of their own, so they use the workspace's, which excludes ballerina:10.
  workspace:
    name: Ballerina workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/workspace
          category: workspace

      - name: Check that both members were scanned as one workspace
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          [ "$PACKAGES" = 2 ] || fail "packages-scanned is '$PACKAGES', expected 2"
          WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-workspace-*)"
          [ "$(ls "$WORK"/logs | wc -l)" -eq 1 ] || fail "bal scan must run once, from the workspace root: $(ls "$WORK"/logs)"
          URIS="$(jq -c '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]' "$SARIF_FILE")"
          jq -e 'any(startswith("test/projects/workspace/billing/")) and any(startswith("test/projects/workspace/shipping/"))' \
            <<< "$URIS" > /dev/null || fail "Both members must have findings: $URIS"
          jq -e 'any(.runs[0].results[]; .ruleId == "ballerina:10") | not' "$SARIF_FILE" > /dev/null \
            || fail "The members must use the workspace's Scan.toml, which excludes ballerina:10"
          [ -z "$(git status --porcelain -- test)" ] || fail "The scan must not change the packages: $(git status --porcelain -- test)"

  # test/exclude-tests has one finding in main.bal and one in tests/, which bal scan leaves out
  # with --exclude-tests, so they reach no platform.
  exclude-tests:
    name: Test sources left out of the scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan without the tests
        id: without-tests
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/exclude-tests
          category: without-tests

      - name: Scan with the tests
        id: with-tests
        uses: ./
        with:
          paths: test/exclude-tests
          exclude-tests: false
          category: with-tests

      - name: Check the findings of each scan
        shell: bash
        env:
          WITHOUT_TESTS: ${{ steps.without-tests.outputs.sarif-file }}
          WITH_TESTS: ${{ steps.with-tests.outputs.sarif-file }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          uris() { jq -c '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | sort' "$1"; }
          [ "$(uris "$WITHOUT_TESTS")" = '["test/exclude-tests/main.bal"]' ] \
            || fail "exclude-tests: true must leave the test sources out: $(uris "$WITHOUT_TESTS")"
          [ "$(uris "$WITH_TESTS")" = '["test/exclude-tests/main.bal","test/exclude-tests/tests/main_test.bal"]' ] \
            || fail "exclude-tests: false must scan the test sources: $(uris "$WITH_TESTS")"
