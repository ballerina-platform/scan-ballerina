name: Setup

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Neither version is given, so the latest Ballerina and the latest compatible scan tool are used.
  latest-versions:
    name: Latest Ballerina and scan tool versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        uses: ./
        with:
          paths: test/projects/single

      - name: Check the versions
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          BAL="$(bal version | sed -n 's/^Ballerina \([0-9][^ ]*\).*/\1/p')"
          TOOL="$(bal tool list | grep -E '^\|scan +\|' | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          echo "Ballerina $BAL, bal scan $TOOL"
          at_least "$BAL" 2201.13.0 || fail "Ballerina $BAL is older than 2201.13.0"
          at_least "$TOOL" 0.12.0 || fail "bal scan $TOOL is older than 0.12.0"

  compatible-versions:
    name: Compatible Ballerina and scan tool versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.12.0
          paths: test/projects/single
          artifacts: true

      - name: Check the result
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          TOTAL: ${{ steps.scan.outputs.total-count }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          [ "$PACKAGES" = 1 ] || fail "packages-scanned is '$PACKAGES', expected 1"
          [ "$TOTAL" -gt 0 ] || fail "total-count is '$TOTAL', expected findings"
          [ -f "$SARIF_FILE" ] || fail "sarif-file '$SARIF_FILE' does not exist"
          bal version | grep -q '^Ballerina 2201\.13\.5 ' || fail "Ballerina 2201.13.5 is not the installed version"
          bal tool list | grep -Eq '^\|scan +\|0\.12\.0 ' || fail "bal scan 0.12.0 is not the active tool version"

      # Only ballerina-version is given, so the latest scan tool compatible with it is installed.
      - name: Scan with the latest compatible scan tool
        id: latest-tool
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: latest-tool

      - name: Check the scan tool version
        shell: bash
        env:
          RESULT: ${{ steps.latest-tool.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          bal version | grep -q '^Ballerina 2201\.13\.5 ' || fail "Ballerina 2201.13.5 is not the installed version"
          TOOL="$(bal tool list | grep -E '^\|scan +\|' | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          echo "bal scan $TOOL"
          at_least "$TOOL" 0.12.0 || fail "bal scan $TOOL is older than 0.12.0"

  version-selection:
    name: Ballerina and scan tool version selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions below the minimums are rejected before Ballerina or the scan tool is installed.
      - name: Scan tool version below the minimum
        id: old-tool-version
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.0
          paths: test/projects/single
          category: old-tool-version

      - name: Ballerina version below the minimum
        id: old-ballerina-version
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.12.0
          paths: test/projects/single
          category: old-ballerina-version
          artifacts: true

      - name: Check that both steps failed before installing anything
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          for id in old-tool-version old-ballerina-version; do
            outcome="$(jq -r --arg id "$id" '.[$id].outcome' <<< "$STEPS")"
            result="$(jq -r --arg id "$id" '.[$id].outputs.result // ""' <<< "$STEPS")"
            sarif="$(jq -r --arg id "$id" '.[$id].outputs["sarif-file"] // ""' <<< "$STEPS")"
            [ "$outcome" = failure ] || fail "$id: the step should fail, but its outcome is '$outcome'"
            [ "$result" = error ] || fail "$id: result is '$result', expected error"
            [ -z "$sarif" ] || fail "$id: sarif-file must be empty, got '$sarif'"
          done
          ! command -v bal > /dev/null || fail "Ballerina must not be installed when a version is below the minimum"
          [ "$FAILURES" -eq 0 ] || exit 1

      # A Ballerina older than the scan tool needs is on the path, as on a runner with an old Ballerina.
      - name: Set up an old Ballerina
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.12.0
          github-token: ${{ github.token }}

      # Only tool-version is given, and the bal on the path is too old for it, so the latest
      # Ballerina is installed.
      - name: Scan with an old Ballerina on the path
        id: old-bal-on-path
        uses: ./
        with:
          tool-version: 0.12.0
          paths: test/projects/single
          category: old-bal-on-path

      - name: Check that the latest Ballerina was installed
        shell: bash
        env:
          RESULT: ${{ steps.old-bal-on-path.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          BAL="$(bal version | sed -n 's/^Ballerina \([0-9][^ ]*\).*/\1/p')"
          at_least "$BAL" 2201.13.0 || fail "Ballerina $BAL is on the path, expected the latest Ballerina"
          bal tool list | grep -Eq '^\|scan +\|0\.12\.0 ' || fail "bal scan 0.12.0 is not the active tool version"

      # The latest Ballerina is on the path, so the version asked for must still be installed. It is
      # the oldest Ballerina the scan tool supports.
      - name: Scan with another Ballerina version
        id: other-ballerina
        uses: ./
        with:
          ballerina-version: 2201.13.0
          tool-version: 0.12.0
          paths: test/projects/single
          category: other-ballerina

      - name: Check that the Ballerina version asked for was installed
        shell: bash
        env:
          RESULT: ${{ steps.other-ballerina.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          bal version | grep -q '^Ballerina 2201\.13\.0 ' || fail "Ballerina 2201.13.0 is not the installed version"

  operating-systems:
    name: Scan on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi, test/restore/sonarqube-failure
          # The same category in every job of the matrix, so the artifact names must still differ.
          category: os
          artifacts: true

      - name: Check the result
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
          UPLOADS: ${{ steps.scan.outputs.uploads }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          jq -e '.artifact.name | test("^os-operating-systems-[0-9a-f]{8}$")' <<< "$UPLOADS" > /dev/null \
            || fail "The artifact must be named after the category, the job and the matrix: $UPLOADS"
          [ "$PACKAGES" = 3 ] || fail "packages-scanned is '$PACKAGES', expected 3"
          [ -f "$SARIF_FILE" ] || fail "sarif-file '$SARIF_FILE' does not exist"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]
              | all(startswith("test/") and (contains("\\") | not))' "$SARIF_FILE" > /dev/null \
            || fail "Every URI must be relative to the repository root, with forward slashes"
          # The SARIF scan hid the [[platform]] entries of test/restore/sonarqube-failure.
          [ -z "$(git status --porcelain -- test)" ] || fail "The scan left changes in test: $(git status --porcelain -- test)"
