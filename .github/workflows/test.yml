name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Test packages, with the findings bal scan reports for each:
#   test/projects/single                    6 low
#   test/projects/multi/orders              1 low
#   test/projects/multi/payments            2 low
#   test/projects/services/api              1 low
#   test/projects/services/internal/legacy  2 low
#   test/projects/secrets                   1 medium
# The packages in test/sonarqube each set up one SonarQube case, with a Scan.toml or a
# sonar-project.properties file.

jobs:
  compatible-versions:
    name: Compatible Ballerina and scan tool versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.12.0
          paths: test/projects/single
          artifacts: true

      - name: Check the result
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          TOTAL: ${{ steps.scan.outputs.total-count }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          [ "$PACKAGES" = 1 ] || fail "packages-scanned is '$PACKAGES', expected 1"
          [ "$TOTAL" -gt 0 ] || fail "total-count is '$TOTAL', expected findings"
          [ -f "$SARIF_FILE" ] || fail "sarif-file '$SARIF_FILE' does not exist"
          bal version | grep -q '^Ballerina 2201\.13\.5 ' || fail "Ballerina 2201.13.5 is not the installed version"
          bal tool list | grep -Eq '^\|scan +\|0\.12\.0 ' || fail "bal scan 0.12.0 is not the active tool version"

  incompatible-versions:
    name: Scan tool version incompatible with Ballerina
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bal scan 0.12.0 needs Ballerina 2201.13 or later.
      - name: Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.12.0
          paths: test/projects/single
          category: incompatible-versions
          artifacts: true

      - name: Check that the step failed
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$OUTCOME" = failure ] || fail "The step should fail, but its outcome is '$OUTCOME'"
          [ "$RESULT" = error ] || fail "result is '$RESULT', expected error"
          [ -z "$SARIF_FILE" ] || fail "sarif-file must be empty, got '$SARIF_FILE'"
          bal version | grep -q '^Ballerina 2201\.12\.0 ' || fail "Ballerina 2201.12.0 is not the installed version"

  code-scanning:
    name: Upload to GitHub code scanning
    # Pull requests from forks get a read-only token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan and upload
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          platforms: github-code-scanning
          category: bal-scan-test
          artifacts: true

      - name: Check the upload
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          UPLOADS: ${{ steps.scan.outputs.uploads }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          jq -e '."github-code-scanning"."sarif-id" | type == "string" and length > 0' <<< "$UPLOADS" > /dev/null \
            || fail "uploads has no sarif-id: $UPLOADS"

  single-path:
    name: One path with several packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          category: single-path
          artifacts: true

      - name: Check that only the given path was scanned
        shell: bash
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$PACKAGES" = 2 ] || fail "packages-scanned is '$PACKAGES', expected 2"
          URIS="$(jq -c '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]' "$SARIF_FILE")"
          jq -e 'length > 0 and all(startswith("test/projects/multi/"))' <<< "$URIS" > /dev/null \
            || fail "Every finding must be under test/projects/multi: $URIS"
          jq -e 'any(startswith("test/projects/multi/orders/")) and any(startswith("test/projects/multi/payments/"))' \
            <<< "$URIS" > /dev/null || fail "Both packages under test/projects/multi must be scanned: $URIS"

  exclude-paths:
    name: Several paths with a package excluded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: |
            test/projects/multi
            test/projects/services
          exclude-paths: test/projects/services/internal/legacy
          category: exclude-paths
          artifacts: true

      - name: Check that the excluded package was not scanned
        shell: bash
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$PACKAGES" = 3 ] || fail "packages-scanned is '$PACKAGES', expected 3"
          URIS="$(jq -c '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]' "$SARIF_FILE")"
          jq -e 'any(startswith("test/projects/services/internal/")) | not' <<< "$URIS" > /dev/null \
            || fail "Findings in the excluded package must be dropped: $URIS"
          jq -e 'any(startswith("test/projects/multi/orders/")) and any(startswith("test/projects/multi/payments/"))
              and any(startswith("test/projects/services/api/"))' <<< "$URIS" > /dev/null \
            || fail "The packages that are not excluded must be scanned: $URIS"

  categories:
    name: Two categories in one job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan orders
        id: orders
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: orders
          artifacts: true

      - name: Scan payments
        id: payments
        uses: ./
        with:
          paths: test/projects/multi/payments
          category: payments
          artifacts: true

      - name: Check that each category has its own results
        shell: bash
        env:
          ORDERS_RESULT: ${{ steps.orders.outputs.result }}
          ORDERS_SARIF: ${{ steps.orders.outputs.sarif-file }}
          ORDERS_TOTAL: ${{ steps.orders.outputs.total-count }}
          PAYMENTS_RESULT: ${{ steps.payments.outputs.result }}
          PAYMENTS_SARIF: ${{ steps.payments.outputs.sarif-file }}
          PAYMENTS_TOTAL: ${{ steps.payments.outputs.total-count }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$ORDERS_RESULT" = passed ] || fail "orders: result is '$ORDERS_RESULT', expected passed"
          [ "$PAYMENTS_RESULT" = passed ] || fail "payments: result is '$PAYMENTS_RESULT', expected passed"
          [ "$(basename "$ORDERS_SARIF")" = orders.sarif ] || fail "orders: sarif-file is '$ORDERS_SARIF'"
          [ "$(basename "$PAYMENTS_SARIF")" = payments.sarif ] || fail "payments: sarif-file is '$PAYMENTS_SARIF'"
          [ "$(dirname "$ORDERS_SARIF")" != "$(dirname "$PAYMENTS_SARIF")" ] || fail "Each category must have its own work directory"
          [ -f "$ORDERS_SARIF" ] || fail "The orders SARIF file must still exist after the payments scan"
          [ "$ORDERS_TOTAL" = 1 ] || fail "orders: total-count is '$ORDERS_TOTAL', expected 1"
          [ "$PAYMENTS_TOTAL" = 2 ] || fail "payments: total-count is '$PAYMENTS_TOTAL', expected 2"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | all(startswith("test/projects/multi/orders/"))' \
            "$ORDERS_SARIF" > /dev/null || fail "orders: the SARIF file has findings from other packages"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | all(startswith("test/projects/multi/payments/"))' \
            "$PAYMENTS_SARIF" > /dev/null || fail "payments: the SARIF file has findings from other packages"

  fail-on-severity:
    name: Fail on medium severity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan a package with low findings only
        id: low
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: low-only
          artifacts: true
          fail-on-severity: medium

      - name: Scan a package with a medium finding
        id: medium
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/secrets
          category: medium
          artifacts: true
          fail-on-severity: medium

      - name: Check the gate
        shell: bash
        env:
          LOW_OUTCOME: ${{ steps.low.outcome }}
          LOW_RESULT: ${{ steps.low.outputs.result }}
          LOW_LOW: ${{ steps.low.outputs.low-count }}
          LOW_MEDIUM: ${{ steps.low.outputs.medium-count }}
          LOW_HIGH: ${{ steps.low.outputs.high-count }}
          MEDIUM_OUTCOME: ${{ steps.medium.outcome }}
          MEDIUM_RESULT: ${{ steps.medium.outputs.result }}
          MEDIUM_MEDIUM: ${{ steps.medium.outputs.medium-count }}
          MEDIUM_SARIF: ${{ steps.medium.outputs.sarif-file }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$LOW_LOW" -gt 0 ] && [ "$LOW_MEDIUM" = 0 ] && [ "$LOW_HIGH" = 0 ] \
            || fail "low-only: expected only low findings, got $LOW_HIGH high, $LOW_MEDIUM medium, $LOW_LOW low"
          [ "$LOW_OUTCOME" = success ] || fail "low-only: low findings must not fail a medium gate"
          [ "$LOW_RESULT" = passed ] || fail "low-only: result is '$LOW_RESULT', expected passed"
          [ "$MEDIUM_MEDIUM" = 1 ] || fail "medium: medium-count is '$MEDIUM_MEDIUM', expected 1"
          [ "$MEDIUM_OUTCOME" = failure ] || fail "medium: a medium finding must fail a medium gate"
          [ "$MEDIUM_RESULT" = failed ] || fail "medium: result is '$MEDIUM_RESULT', expected failed"
          [ -f "$MEDIUM_SARIF" ] || fail "medium: the SARIF file must be written even when the gate fails"

  max-findings:
    name: Max findings without a severity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate is off, so max-findings has no effect even though there are more findings.
      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: max-findings
          max-findings: 1
          artifacts: true

      - name: Check that the step passed
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          RESULT: ${{ steps.scan.outputs.result }}
          TOTAL: ${{ steps.scan.outputs.total-count }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$TOTAL" -gt 1 ] || fail "total-count is '$TOTAL', expected more than max-findings"
          [ "$OUTCOME" = success ] || fail "The step should pass, but its outcome is '$OUTCOME'"
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"

  severity-and-max-findings:
    name: Fail on severity with max findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count the findings
        id: baseline
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: baseline
          artifacts: true

      - name: Work out the limits
        id: limits
        shell: bash
        env:
          TOTAL: ${{ steps.baseline.outputs.total-count }}
        run: |
          set -euo pipefail
          [ "$TOTAL" -gt 0 ] || { echo "::error::total-count is '$TOTAL', expected findings"; exit 1; }
          echo "at=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "below=$((TOTAL - 1))" >> "$GITHUB_OUTPUT"

      - name: Scan with max-findings equal to the findings
        id: at-limit
        uses: ./
        with:
          paths: test/projects/single
          category: at-limit
          artifacts: true
          fail-on-severity: low
          max-findings: ${{ steps.limits.outputs.at }}

      - name: Scan with max-findings one below the findings
        id: over-limit
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/single
          category: over-limit
          artifacts: true
          fail-on-severity: low
          max-findings: ${{ steps.limits.outputs.below }}

      - name: Check the gate
        shell: bash
        env:
          AT_OUTCOME: ${{ steps.at-limit.outcome }}
          AT_RESULT: ${{ steps.at-limit.outputs.result }}
          OVER_OUTCOME: ${{ steps.over-limit.outcome }}
          OVER_RESULT: ${{ steps.over-limit.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$AT_OUTCOME" = success ] || fail "at-limit: findings up to max-findings must pass"
          [ "$AT_RESULT" = passed ] || fail "at-limit: result is '$AT_RESULT', expected passed"
          [ "$OVER_OUTCOME" = failure ] || fail "over-limit: more findings than max-findings must fail"
          [ "$OVER_RESULT" = failed ] || fail "over-limit: result is '$OVER_RESULT', expected failed"

  # The annotation-checks job checks the annotations of this job, which finds it by its name.
  annotations:
    name: Annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan with annotations
        id: annotated
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: annotated
          artifacts: true
          annotations: true

      # A control, so that the check also shows annotations=false adds none.
      - name: Scan without annotations
        id: plain
        uses: ./
        with:
          paths: test/projects/multi/payments
          category: plain
          artifacts: true
          annotations: false

  job-summary:
    name: Job summary turned off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A control, so that the check below also shows that the summary files can be read.
      - name: Scan with a job summary
        id: with-summary
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: with-summary
          artifacts: true

      - name: Scan without a job summary
        id: without-summary
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: without-summary
          artifacts: true
          job-summary: false

      # Each step writes its summary to a file in the runner's file command directory.
      - name: Check the job summary
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          DIR="$RUNNER_TEMP/_runner_file_commands"
          grep -rqF '### ✅ bal scan: with-summary' "$DIR" \
            || fail "job-summary=true must write the summary (no summary found in $DIR)"
          if grep -rqF 'bal scan: without-summary' "$DIR"; then
            fail "job-summary=false must not write the summary"
          fi

  artifacts:
    name: SARIF file saved as an artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan and save the SARIF file
        id: saved
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          category: artifacts-true
          artifacts: true

      - name: Scan with artifacts false
        id: unsaved
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: artifacts-false
          artifacts: false

      - name: Scan with artifacts left out
        id: default
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: artifacts-default

      # The report names that artifacts took before are no longer accepted.
      - name: Scan with a value that is not true or false
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: artifacts-invalid
          artifacts: sarif

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/downloaded

      - name: Check the artifacts
        shell: bash
        env:
          SAVED_SARIF: ${{ steps.saved.outputs.sarif-file }}
          SAVED_UPLOADS: ${{ steps.saved.outputs.uploads }}
          UNSAVED_RESULT: ${{ steps.unsaved.outputs.result }}
          UNSAVED_SARIF: ${{ steps.unsaved.outputs.sarif-file }}
          UNSAVED_UPLOADS: ${{ steps.unsaved.outputs.uploads }}
          DEFAULT_RESULT: ${{ steps.default.outputs.result }}
          DEFAULT_UPLOADS: ${{ steps.default.outputs.uploads }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_RESULT: ${{ steps.invalid.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          DIR="$RUNNER_TEMP/downloaded"
          (cd "$DIR" && find . -type f | sort)

          SAVED="$DIR/artifacts-true-artifacts"
          [ "$(cd "$SAVED" && find . -type f)" = ./artifacts-true.sarif ] \
            || fail "true: the artifact must hold the merged SARIF file only"
          cmp -s "$SAVED/artifacts-true.sarif" "$SAVED_SARIF" \
            || fail "true: the artifact must hold the same file as the sarif-file output"
          jq -e '.runs[0].results | length > 0' "$SAVED/artifacts-true.sarif" > /dev/null \
            || fail "true: the SARIF file in the artifact has no findings"
          jq -e '.artifact | .name == "artifacts-true-artifacts" and (.id | length > 0) and (.url | startswith("https://"))' \
            <<< "$SAVED_UPLOADS" > /dev/null || fail "true: uploads has no artifact entry: $SAVED_UPLOADS"
          SAVED_WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-artifacts-true-*)"
          [ "$(ls "$SAVED_WORK"/logs | wc -l)" -eq 2 ] \
            || fail "true: bal scan must run once per package: $(ls "$SAVED_WORK"/logs)"

          [ "$UNSAVED_RESULT" = passed ] || fail "false: result is '$UNSAVED_RESULT', expected passed"
          [ -f "$UNSAVED_SARIF" ] || fail "false: the SARIF file must still be written, got sarif-file '$UNSAVED_SARIF'"
          [ ! -e "$DIR/artifacts-false-artifacts" ] || fail "false: no artifact must be saved"
          jq -e 'has("artifact") | not' <<< "$UNSAVED_UPLOADS" > /dev/null \
            || fail "false: uploads must have no artifact entry: $UNSAVED_UPLOADS"

          [ "$DEFAULT_RESULT" = passed ] || fail "default: result is '$DEFAULT_RESULT', expected passed"
          [ ! -e "$DIR/artifacts-default-artifacts" ] || fail "default: artifacts must default to false, but an artifact was saved"
          jq -e 'has("artifact") | not' <<< "$DEFAULT_UPLOADS" > /dev/null \
            || fail "default: uploads must have no artifact entry: $DEFAULT_UPLOADS"

          [ "$INVALID_OUTCOME" = failure ] || fail "invalid: artifacts: sarif must fail the step, but its outcome is '$INVALID_OUTCOME'"
          [ "$INVALID_RESULT" = error ] || fail "invalid: result is '$INVALID_RESULT', expected error"
          [ ! -e "$DIR/artifacts-invalid-artifacts" ] || fail "invalid: no artifact must be saved when the inputs are invalid"
          [ -z "$(git status --porcelain -- test)" ] || fail "The scans must not change the packages: $(git status --porcelain -- test)"

  # The SonarQube tests report to a dummy server, so each scan that gets past the settings fails
  # when SonarScanner cannot reach it. They check what the action resolved and downloaded, and that
  # the platform plugin ran SonarScanner against the server.

  # The annotation-checks job checks the error each step of this job reported, and finds it by its
  # name. Each step's ID is also its category, which titles its errors.
  sonarqube-invalid-settings:
    name: SonarQube settings that fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Absolute plugin path in Scan.toml
        id: absolute-plugin
        continue-on-error: true
        uses: ./
        with:
          paths: test/sonarqube/absolute-plugin
          category: absolute-plugin
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: absolute-plugin

      - name: http plugin URL in Scan.toml
        id: http-plugin
        continue-on-error: true
        uses: ./
        with:
          paths: test/sonarqube/http-plugin
          category: http-plugin
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: http-plugin

      # Pull requests from forks get no secrets, so there the action skips SonarQube instead.
      - name: No token
        id: no-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: no-token
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              project-key: orders

      # A secret that is not set resolves to an empty value.
      - name: Empty token
        id: empty-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: empty-token
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: ${{ secrets.UNSET_SONAR_TOKEN }}
              project-key: orders

      - name: Two packages with the same project key
        id: duplicate-keys
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi
          category: duplicate-keys
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              packages:
                - path: test/projects/multi/orders
                  project-key: shared-key
                - path: test/projects/multi/payments
                  project-key: shared-key

      - name: Platform-level project key for two packages
        id: shared-project-key
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi
          category: shared-project-key
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: shared-key

      # orders has a key of its own, which does not make the platform-level key apply to payments.
      - name: Platform-level project key with one package keyed under packages
        id: leftover-project-key
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi
          category: leftover-project-key
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: shared-key
              packages:
                - path: test/projects/multi/orders
                  project-key: orders

      - name: Platform-level project name for two keyed packages
        id: shared-project-name
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi
          category: shared-project-name
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-name: Shared Name
              packages:
                - path: test/projects/multi/orders
                  project-key: orders
                - path: test/projects/multi/payments
                  project-key: payments

      - name: Project key at the platform level and in the package's item
        id: project-key-twice
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: project-key-twice
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: orders
              packages:
                - path: test/projects/multi/orders
                  project-key: orders-item

      - name: http server URL
        id: http-host
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: http-host
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: http://sonarqube.example.invalid
              token: dummy-token
              project-key: orders

      - name: Package settings that match no package
        id: unmatched-package
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: unmatched-package
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: orders
              packages:
                - path: test/projects/missing
                  project-key: missing

      - name: Plugin version below the minimum
        id: old-plugin-version
        continue-on-error: true
        uses: ./
        with:
          paths: test/projects/multi/orders
          category: old-plugin-version
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              plugin-version: 0.2.0
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: orders

      - name: Check that each step failed
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          while IFS=$'\t' read -r id outcome result; do
            if [ "$outcome" = skipped ]; then
              echo "$id: skipped"
              continue
            fi
            [ "$outcome" = failure ] || fail "$id: the step should fail, but its outcome is '$outcome'"
            [ "$result" = error ] || fail "$id: result is '$result', expected error"
          done < <(jq -r 'to_entries[] | [.key, .value.outcome, .value.outputs.result // ""] | @tsv' <<< "$STEPS")
          [ ! -d "$RUNNER_TEMP/scan-ballerina-tools" ] || fail "Invalid SonarQube settings must fail before anything is downloaded"
          [ "$FAILURES" -eq 0 ] || exit 1

  sonarqube-remote-plugin:
    name: SonarQube plugin from an https URL in Scan.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Serves the platform plugin at the URL in test/sonarqube/remote-plugin/Scan.toml, with a
      # self-signed certificate that the runner trusts.
      - name: Serve the plugin over https
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/plugin-server"
          mkdir -p "$DIR/www"
          cd "$DIR"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -o www/sonar-platform-plugin.jar \
            https://maven.pkg.github.com/ballerina-platform/sonar-ballerina/io/ballerina/sonar/sonar-platform-plugin/0.3.0/sonar-platform-plugin-0.3.0.jar
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout key.pem -out cert.pem
          sudo cp cert.pem /usr/local/share/ca-certificates/plugin-server.crt
          sudo update-ca-certificates
          cat > server.py << 'PY'
          import functools, http.server, ssl
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory="www")
          server = http.server.HTTPServer(("localhost", 8443), handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain("cert.pem", "key.pem")
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          nohup python3 server.py > server.log 2>&1 &
          for _ in $(seq 1 10); do
            curl -fsS -o /dev/null https://localhost:8443/sonar-platform-plugin.jar && exit 0
            sleep 1
          done
          cat server.log
          echo "::error::The plugin server did not start"
          exit 1

      - name: Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/sonarqube/remote-plugin
          category: remote-plugin
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: remote-plugin

      - name: Check that the plugin came from the URL
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-remote-plugin-*)"
          SERVED="$RUNNER_TEMP/plugin-server/www/sonar-platform-plugin.jar"
          jq . "$WORK/sonarqube.json"
          jq -e '.[0].plugin == {kind: "url", value: "https://localhost:8443/sonar-platform-plugin.jar"}' \
            "$WORK/sonarqube.json" > /dev/null || fail "The plugin must resolve to the URL in Scan.toml"
          PLUGIN_FILE="$(jq -r '.[0]."plugin-file"' "$WORK/sonarqube.json")"
          [ -f "$PLUGIN_FILE" ] || fail "The plugin was not downloaded to '$PLUGIN_FILE'"
          [ "$(sha256sum < "$PLUGIN_FILE")" = "$(sha256sum < "$SERVED")" ] || fail "The downloaded plugin differs from the served one"
          # One request is the start-up check of the server above.
          [ "$(grep -c 'GET /sonar-platform-plugin.jar ' "$RUNNER_TEMP/plugin-server/server.log")" -ge 2 ] \
            || fail "The action did not request the plugin from the URL"
          [ ! -e "$RUNNER_TEMP/scan-ballerina-tools/sonar-platform-plugin-0.3.0.jar" ] \
            || fail "The pinned plugin version must not be downloaded when Scan.toml gives a URL"
          grep -q 'SonarScanner CLI' "$WORK/logs/sonarqube-0.log" || fail "The plugin did not run SonarScanner"
          grep -qF 'https://sonarqube.example.invalid/' "$WORK/logs/sonarqube-0.log" \
            || fail "SonarScanner did not report to the configured server"
          [ "$OUTCOME" = failure ] || fail "The step should fail, since the server does not exist, but its outcome is '$OUTCOME'"
          [ "$RESULT" = error ] || fail "result is '$RESULT', expected error"
          [ -f "$SARIF_FILE" ] || fail "A failed SonarQube scan must not stop the SARIF file, got sarif-file '$SARIF_FILE'"
          [ -z "$(git status --porcelain -- test)" ] || fail "Scan.toml must be restored after the scan: $(git status --porcelain -- test)"

  sonarqube-plugin-version:
    name: SonarQube plugin version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: plugin-version
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              plugin-version: 0.3.0
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: orders

      - name: Check that the requested version was used
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.scan.outcome }}
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          TOTAL: ${{ steps.scan.outputs.total-count }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-plugin-version-*)"
          CACHE="$RUNNER_TEMP/scan-ballerina-tools"
          jq . "$WORK/sonarqube.json"
          jq -e '.[0].plugin == {kind: "version", value: "0.3.0"}' "$WORK/sonarqube.json" > /dev/null \
            || fail "The plugin must resolve to version 0.3.0"
          PLUGIN_FILE="$(jq -r '.[0]."plugin-file"' "$WORK/sonarqube.json")"
          [ "$PLUGIN_FILE" = "$CACHE/sonar-platform-plugin-0.3.0.jar" ] || fail "plugin-file is '$PLUGIN_FILE'"
          [ -f "$PLUGIN_FILE" ] || fail "The plugin was not downloaded"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -o "$RUNNER_TEMP/expected.jar" \
            https://maven.pkg.github.com/ballerina-platform/sonar-ballerina/io/ballerina/sonar/sonar-platform-plugin/0.3.0/sonar-platform-plugin-0.3.0.jar
          [ "$(sha256sum < "$PLUGIN_FILE")" = "$(sha256sum < "$RUNNER_TEMP/expected.jar")" ] \
            || fail "The downloaded plugin is not version 0.3.0"
          source scripts/lib.sh
          [ "$(sha256_of "$PLUGIN_FILE")" = "$(sonar_plugin_sha256 0.3.0)" ] \
            || fail "The checksum pinned for version 0.3.0 does not match the published plugin"
          grep -q 'SonarScanner CLI' "$WORK/logs/sonarqube-0.log" || fail "The plugin did not run SonarScanner"
          [ "$OUTCOME" = failure ] || fail "The step should fail, since the server does not exist, but its outcome is '$OUTCOME'"
          [ "$RESULT" = error ] || fail "result is '$RESULT', expected error"
          # SonarQube is one destination, so its failure still leaves the SARIF file and the counts.
          [ -f "$SARIF_FILE" ] || fail "A failed SonarQube scan must not stop the SARIF file, got sarif-file '$SARIF_FILE'"
          [ "$TOTAL" = 1 ] || fail "total-count is '$TOTAL', expected 1"
          # The package has no Scan.toml, so the one the action wrote for the scan must be deleted.
          [ -z "$(git status --porcelain -- test)" ] || fail "The scan left changes in test: $(git status --porcelain -- test)"

  sonarqube-properties-file:
    name: SonarQube settings from sonar-project.properties
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Only host-url and token are given, so the key and name come from the properties file,
      # and the plugin is the pinned version.
      - name: Scan with only host-url
        id: properties
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/sonarqube/properties
          category: properties
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token

      - name: Scan with project-key also given
        id: override
        continue-on-error: true
        uses: ./
        with:
          paths: test/sonarqube/properties
          category: override
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: override-key

      - name: Check the resolved settings
        shell: bash
        env:
          PROPERTIES_OUTCOME: ${{ steps.properties.outcome }}
          PROPERTIES_RESULT: ${{ steps.properties.outputs.result }}
          OVERRIDE_OUTCOME: ${{ steps.override.outcome }}
          OVERRIDE_RESULT: ${{ steps.override.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          PROPERTIES_WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-properties-*)"
          OVERRIDE_WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-override-*)"
          jq . "$PROPERTIES_WORK/sonarqube.json" "$OVERRIDE_WORK/sonarqube.json"

          jq -e '.[0] | ."project-key" == "properties-key" and ."project-name" == "Properties Name"' \
            "$PROPERTIES_WORK/sonarqube.json" > /dev/null || fail "properties: the key and name must come from the properties file"
          jq -e '.[0]."host-url" == "https://sonarqube.example.invalid"' "$PROPERTIES_WORK/sonarqube.json" > /dev/null \
            || fail "properties: host-url must override sonar.host.url"
          jq -e '.[0]."properties-file" | endswith("/test/sonarqube/properties/sonar-project.properties")' \
            "$PROPERTIES_WORK/sonarqube.json" > /dev/null || fail "properties: the package's sonar-project.properties was not used"
          jq -e '.[0].plugin == {kind: "version", value: "0.3.0"}' "$PROPERTIES_WORK/sonarqube.json" > /dev/null \
            || fail "properties: the plugin must default to the pinned version 0.3.0"
          [ -f "$RUNNER_TEMP/scan-ballerina-tools/sonar-platform-plugin-0.3.0.jar" ] || fail "properties: the pinned plugin was not downloaded"
          grep -qF 'https://sonarqube.example.invalid/' "$PROPERTIES_WORK/logs/sonarqube-0.log" \
            || fail "properties: SonarScanner did not report to host-url"
          if grep -qF 'properties.example.invalid' "$PROPERTIES_WORK/logs/sonarqube-0.log"; then
            fail "properties: SonarScanner used sonar.host.url instead of host-url"
          fi
          [ "$PROPERTIES_OUTCOME" = failure ] && [ "$PROPERTIES_RESULT" = error ] \
            || fail "properties: expected the step to fail with result error, got '$PROPERTIES_OUTCOME' and '$PROPERTIES_RESULT'"

          jq -e '.[0] | ."project-key" == "override-key" and ."project-name" == "Properties Name"' \
            "$OVERRIDE_WORK/sonarqube.json" > /dev/null || fail "override: project-key must override sonar.projectKey only"
          [ "$OVERRIDE_OUTCOME" = failure ] && [ "$OVERRIDE_RESULT" = error ] \
            || fail "override: expected the step to fail with result error, got '$OVERRIDE_OUTCOME' and '$OVERRIDE_RESULT'"
          [ -z "$(git status --porcelain -- test)" ] || fail "The scan must not change the package: $(git status --porcelain -- test)"

  sonarqube-platform-project-key:
    name: SonarQube project key at the platform level for one package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # test/projects/multi holds two packages, and exclude-paths leaves one, so the platform-level
      # key applies to it. Its item sets only project-name, which does not conflict with the key.
      - name: Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          exclude-paths: test/projects/multi/payments
          category: platform-project-key
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: orders
              packages:
                - path: test/projects/multi/orders
                  project-name: Orders Service

      - name: Check the resolved settings
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          RESULT: ${{ steps.scan.outputs.result }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-platform-project-key-*)"
          jq . "$WORK/sonarqube.json"
          # The SonarQube scan fails, but the SARIF scan of the one package that exclude-paths left
          # passes.
          [ "$PACKAGES" = 1 ] || fail "packages-scanned is '$PACKAGES', expected 1"
          jq -e 'length == 1 and (.[0] | .package == "test/projects/multi/orders"
              and ."project-key" == "orders" and ."project-name" == "Orders Service")' \
            "$WORK/sonarqube.json" > /dev/null || fail "orders must take the platform-level key and the name from its item"
          # The settings passed, so the scan reached SonarScanner, which fails on the dummy server.
          grep -q 'SonarScanner CLI' "$WORK/logs/sonarqube-0.log" || fail "The plugin did not run SonarScanner"
          [ "$OUTCOME" = failure ] || fail "The step should fail, since the server does not exist, but its outcome is '$OUTCOME'"
          [ "$RESULT" = error ] || fail "result is '$RESULT', expected error"

  # The packages in test/restore have Scan.toml files with [[platform]] entries, sub-tables, odd
  # spacing and no final newline, which the action changes for a scan and must restore byte for
  # byte when that scan fails.
  scan-toml-restore:
    name: Scan.toml restored after a failed scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Record the Scan.toml files
        shell: bash
        run: sha256sum test/restore/*/Scan.toml | tee "$RUNNER_TEMP/scan-toml.sha256"

      # The package does not compile, so the SARIF scan fails while its [[platform]] entries are
      # hidden.
      - name: Failed SARIF scan
        id: sarif-failure
        continue-on-error: true
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/restore/sarif-failure
          category: sarif-failure

      # The SARIF scan passes, and the SonarQube scan fails on the dummy server while the sonarqube
      # entry points to the pinned plugin.
      - name: Failed SonarQube scan
        id: sonarqube-failure
        continue-on-error: true
        uses: ./
        with:
          paths: test/restore/sonarqube-failure
          category: sonarqube-failure
          platforms: sonarqube
          platform-config: |
            sonarqube:
              plugin-version: 0.3.0
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: restore

      - name: Check that the files were restored
        shell: bash
        env:
          SARIF_OUTCOME: ${{ steps.sarif-failure.outcome }}
          SARIF_RESULT: ${{ steps.sarif-failure.outputs.result }}
          SONARQUBE_OUTCOME: ${{ steps.sonarqube-failure.outcome }}
          SONARQUBE_RESULT: ${{ steps.sonarqube-failure.outputs.result }}
          SONARQUBE_SARIF_FILE: ${{ steps.sonarqube-failure.outputs.sarif-file }}
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }

          SARIF_WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-sarif-failure-*)"
          [ "$SARIF_OUTCOME" = failure ] && [ "$SARIF_RESULT" = error ] \
            || fail "sarif-failure: expected the step to fail with result error, got '$SARIF_OUTCOME' and '$SARIF_RESULT'"
          grep -q 'compilation contains errors' "$SARIF_WORK/logs/scan-0.log" \
            || fail "sarif-failure: the SARIF scan must fail on the compilation error"

          SONARQUBE_WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-sonarqube-failure-*)"
          [ "$SONARQUBE_OUTCOME" = failure ] && [ "$SONARQUBE_RESULT" = error ] \
            || fail "sonarqube-failure: expected the step to fail with result error, got '$SONARQUBE_OUTCOME' and '$SONARQUBE_RESULT'"
          [ -f "$SONARQUBE_WORK/reports/0.sarif" ] || fail "sonarqube-failure: the SARIF scan must pass"
          [ -f "$SONARQUBE_SARIF_FILE" ] || fail "sonarqube-failure: a failed SonarQube scan must not stop the SARIF file"
          grep -q 'SonarScanner CLI' "$SONARQUBE_WORK/logs/sonarqube-0.log" \
            || fail "sonarqube-failure: the SonarQube scan must load the plugin from Scan.toml and run SonarScanner"

          sha256sum -c "$RUNNER_TEMP/scan-toml.sha256" || fail "Scan.toml must be restored byte for byte"
          [ -z "$(git status --porcelain -- test)" ] || fail "The scans left changes in test: $(git status --porcelain -- test)"
          [ ! -s .git/scan-ballerina/manifest.tsv ] || fail "The journal must be empty once the files are restored"
          # .gitignore hides what SonarScanner and the platform plugin write, so look for it directly.
          for f in .scannerwork ballerina-static-code-analysis-results.json; do
            [ ! -e "test/restore/sonarqube-failure/$f" ] || fail "sonarqube-failure: $f must be deleted after the SonarQube scan"
          done
          [ "$FAILURES" -eq 0 ] || exit 1

  # test/remote-scan-toml reads its Scan.toml from an https URL, which the action downloads and
  # changes a local copy of for each scan. The served file excludes the package's only finding,
  # and its sonarqube [[platform]] entry names a plugin URL.
  remote-scan-toml:
    name: Remote Scan.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Serve Scan.toml and the plugin over https
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/scan-toml-server"
          mkdir -p "$DIR/www"
          cd "$DIR"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -o www/sonar-platform-plugin.jar \
            https://maven.pkg.github.com/ballerina-platform/sonar-ballerina/io/ballerina/sonar/sonar-platform-plugin/0.3.0/sonar-platform-plugin-0.3.0.jar
          printf '%s\n' '[rule]' 'exclude = ["ballerina:1"]' '' '[[platform]]' 'name = "sonarqube"' \
            'path = "https://localhost:8443/sonar-platform-plugin.jar"' > www/Scan.toml
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout key.pem -out cert.pem
          sudo cp cert.pem /usr/local/share/ca-certificates/scan-toml-server.crt
          sudo update-ca-certificates
          cat > server.py << 'PY'
          import functools, http.server, ssl
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory="www")
          server = http.server.HTTPServer(("localhost", 8443), handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain("cert.pem", "key.pem")
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          nohup python3 server.py > server.log 2>&1 &
          for _ in $(seq 1 10); do
            curl -fsS -o /dev/null https://localhost:8443/Scan.toml && exit 0
            sleep 1
          done
          cat server.log
          echo "::error::The server did not start"
          exit 1

      - name: Record Ballerina.toml
        shell: bash
        run: sha256sum test/remote-scan-toml/Ballerina.toml | tee "$RUNNER_TEMP/ballerina-toml.sha256"

      # The [[platform]] entry is hidden from the copy, so bal scan writes the SARIF report.
      - name: Scan without platforms
        id: sarif
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/remote-scan-toml
          category: remote-scan-toml

      # The SonarQube scan fails on the dummy server, after the plugin from the entry ran.
      - name: Scan with SonarQube
        id: sonarqube
        continue-on-error: true
        uses: ./
        with:
          paths: test/remote-scan-toml
          category: remote-scan-toml-sonarqube
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: https://sonarqube.example.invalid
              token: dummy-token
              project-key: remote-scan-toml

      - name: Check the scans
        shell: bash
        env:
          SARIF_RESULT: ${{ steps.sarif.outputs.result }}
          SARIF_FILE: ${{ steps.sarif.outputs.sarif-file }}
          SARIF_TOTAL: ${{ steps.sarif.outputs.total-count }}
          SONARQUBE_OUTCOME: ${{ steps.sonarqube.outcome }}
          SONARQUBE_RESULT: ${{ steps.sonarqube.outputs.result }}
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }

          [ "$SARIF_RESULT" = passed ] || fail "sarif: result is '$SARIF_RESULT', expected passed"
          [ -f "$SARIF_FILE" ] || fail "sarif: no SARIF file, so the [[platform]] entry was not hidden"
          [ "$SARIF_TOTAL" = 0 ] || fail "sarif: total-count is '$SARIF_TOTAL', expected 0, since the remote Scan.toml excludes ballerina:1"

          SONARQUBE_WORK="$(ls -d "$RUNNER_TEMP"/scan-ballerina-remote-scan-toml-sonarqube-*)"
          jq . "$SONARQUBE_WORK/sonarqube.json"
          jq -e '.[0] | ."scan-toml-kind" == "remote"
              and .plugin == {kind: "url", value: "https://localhost:8443/sonar-platform-plugin.jar"}' \
            "$SONARQUBE_WORK/sonarqube.json" > /dev/null || fail "sonarqube: the plugin must resolve to the URL in the remote Scan.toml"
          grep -q 'SonarScanner CLI' "$SONARQUBE_WORK/logs/sonarqube-0.log" \
            || fail "sonarqube: the plugin did not run SonarScanner"
          [ "$SONARQUBE_OUTCOME" = failure ] && [ "$SONARQUBE_RESULT" = error ] \
            || fail "sonarqube: expected the step to fail with result error, got '$SONARQUBE_OUTCOME' and '$SONARQUBE_RESULT'"

          sha256sum -c "$RUNNER_TEMP/ballerina-toml.sha256" || fail "Ballerina.toml must be restored byte for byte"
          [ -z "$(git status --porcelain -- test)" ] || fail "The scans left changes in test: $(git status --porcelain -- test)"
          [ "$FAILURES" -eq 0 ] || exit 1

  # The packages in test/scan-config point [scan] configPath in Ballerina.toml to a Scan.toml the
  # action cannot use: an http URL, an https URL that cannot be reached, a missing file, and no
  # configPath at all. The annotation-checks job checks the error each one reported.
  scan-config:
    name: Scan.toml settings that fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan-config
        continue-on-error: true
        uses: ./
        with:
          paths: test/scan-config
          category: scan-config

      - name: Check that each step failed before anything was downloaded
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          while IFS=$'\t' read -r id outcome result; do
            [ "$outcome" = failure ] || fail "$id: the step should fail, but its outcome is '$outcome'"
            [ "$result" = error ] || fail "$id: result is '$result', expected error"
          done < <(jq -r 'to_entries[] | [.key, .value.outcome, .value.outputs.result // ""] | @tsv' <<< "$STEPS")
          [ ! -d "$RUNNER_TEMP/scan-ballerina-tools" ] || fail "A Scan.toml the action cannot use must fail before anything is downloaded"
          if command -v bal > /dev/null 2>&1; then
            fail "A Scan.toml the action cannot use must fail before Ballerina is installed"
          fi
          [ "$FAILURES" -eq 0 ] || exit 1

  # test/sarif holds two bal scan reports, of a package whose path has a space and of a workspace,
  # with run.artifacts, artifact indexes, a test file, a '#' in a file name and a backslash in a
  # URI. The merged file must match test/sarif/expected.sarif.
  sarif-golden:
    name: SARIF merging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge the reports and compare with the golden files
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sarif-golden"
          mkdir -p "$WORK"
          cp -r test/sarif/units.json test/sarif/reports "$WORK/"
          SCAN_WORK_DIR="$WORK" EXCLUDE_TESTS=true EXCLUDE_PATHS= CATEGORY=golden bash scripts/merge-sarif.sh
          diff -u test/sarif/expected.sarif <(jq -S . "$WORK/golden.sarif")
          diff -u test/sarif/expected-findings.json <(jq -S . "$WORK/findings.json")

      - name: Validate the merged file against the SARIF 2.1.0 schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sarif-schema.json" https://json.schemastore.org/sarif-2.1.0.json
          pipx run check-jsonschema --schemafile "$RUNNER_TEMP/sarif-schema.json" "$RUNNER_TEMP/sarif-golden/golden.sarif"

  # test/toml holds Scan.toml files with comments, inline tables, indented and spaced headers,
  # tabs and sub-tables, and two forms the action must reject before scanning.
  toml-editing:
    name: Scan.toml editing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare with the golden files
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib.sh
          diff -u test/toml/expected/mixed.all.toml <(drop_platforms all < test/toml/mixed.toml)
          diff -u test/toml/expected/mixed.sonarqube.toml <(drop_platforms sonarqube < test/toml/mixed.toml)
          # The edited files must still be valid TOML, with the right entries left.
          [ "$(drop_platforms all < test/toml/mixed.toml | yq -p toml -o json '.platform // [] | length')" = 0 ]
          [ "$(drop_platforms sonarqube < test/toml/mixed.toml | yq -p toml -o json -I0 '[.platform[].name]')" = '["other"]' ]
          [ -z "$(platform_form_problem test/toml/mixed.toml mixed)" ]
          platform_form_problem test/toml/inline-array.toml inline | grep -q 'such as an array of inline tables'
          platform_form_problem test/toml/multiline-string.toml multiline | grep -q 'without breaking the file'

  # A run that is stopped before it restores its files leaves them in the journal, and the next
  # run restores them before it reads any Ballerina.toml or Scan.toml.
  interrupted-restore:
    name: Files restored after an interrupted run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leave a changed Scan.toml and Ballerina.toml behind
        shell: bash
        run: |
          set -euo pipefail
          sha256sum test/restore/sarif-failure/Scan.toml test/remote-scan-toml/Ballerina.toml | tee "$RUNNER_TEMP/files.sha256"
          SCAN_WORK_DIR="$RUNNER_TEMP/stopped" bash -c '
            source scripts/lib.sh
            mkdir -p "$SCAN_WORK_DIR"
            journal_init
            for f in test/restore/sarif-failure/Scan.toml test/remote-scan-toml/Ballerina.toml; do
              printf "changed by a stopped run\n" > "$SCAN_WORK_DIR/new"
              protect "$f" "$(sha256_of "$SCAN_WORK_DIR/new")"
              cp "$SCAN_WORK_DIR/new" "$f"
            done
            protect test/projects/single/.scannerwork
            mkdir -p test/projects/single/.scannerwork
            # Killed: no trap runs.
            kill -9 $$' || true
          if sha256sum --quiet -c "$RUNNER_TEMP/files.sha256" 2> /dev/null; then
            echo "::error::The stopped run must leave the files changed"
            exit 1
          fi

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: interrupted-restore

      - name: Check that the files were restored
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          sha256sum -c "$RUNNER_TEMP/files.sha256" || fail "The files must be restored byte for byte"
          [ ! -e test/projects/single/.scannerwork ] || fail ".scannerwork must be deleted"
          [ ! -s .git/scan-ballerina/manifest.tsv ] || fail "The journal must be empty once it is replayed"

  operating-systems:
    name: Scan on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan
        uses: ./
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi, test/restore/sonarqube-failure
          # The same category in every job of the matrix, so the artifact names must still differ.
          category: os
          artifacts: true

      - name: Check the result
        shell: bash
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
          UPLOADS: ${{ steps.scan.outputs.uploads }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$RESULT" = passed ] || fail "result is '$RESULT', expected passed"
          jq -e '.artifact.name | test("^os-operating-systems-[0-9a-f]{8}$")' <<< "$UPLOADS" > /dev/null \
            || fail "The artifact must be named after the category, the job and the matrix: $UPLOADS"
          [ "$PACKAGES" = 3 ] || fail "packages-scanned is '$PACKAGES', expected 3"
          [ -f "$SARIF_FILE" ] || fail "sarif-file '$SARIF_FILE' does not exist"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri]
              | all(startswith("test/") and (contains("\\") | not))' "$SARIF_FILE" > /dev/null \
            || fail "Every URI must be relative to the repository root, with forward slashes"
          # The SARIF scan hid the [[platform]] entries of test/restore/sonarqube-failure.
          [ -z "$(git status --porcelain -- test)" ] || fail "The scan left changes in test: $(git status --porcelain -- test)"

  # Annotations reach the check run only after the job that wrote them has finished, so they are
  # checked from this job.
  annotation-checks:
    name: Check the annotations
    needs: [annotations, sonarqube-invalid-settings, scan-config]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the annotations of the Annotations job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh Annotations)"
          jq . <<< "$ANNOTATIONS"
          jq -e 'any(.path == "test/projects/multi/orders/main.bal" and .title == "ballerina:1"
              and .annotation_level == "notice" and .start_line == 5)' <<< "$ANNOTATIONS" > /dev/null \
            || fail "annotations=true must annotate the ballerina:1 finding in test/projects/multi/orders/main.bal"
          jq -e 'any(.path | startswith("test/projects/multi/payments/")) | not' <<< "$ANNOTATIONS" > /dev/null \
            || fail "annotations=false must not annotate findings"

      - name: Check the errors of the invalid SonarQube settings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pull requests from forks get no secrets, so there the token steps are skipped.
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # The error each step must report, by step ID, which is also its category.
          EXPECTED: |
            {
              "absolute-plugin": "has the absolute path '/opt/sonar/sonar-platform-plugin.jar'",
              "http-plugin": "has the path 'http://localhost:8443/sonar-platform-plugin.jar'. Use an https URL",
              "no-token": "Package 'test/projects/multi/orders' has no SonarQube token",
              "empty-token": "platform-config.sonarqube has an empty token",
              "duplicate-keys": "resolve to the same SonarQube project key \"shared-key\"",
              "shared-project-key": "platform-config.sonarqube.project-key is for a single package, but 2 packages are scanned",
              "leftover-project-key": "platform-config.sonarqube.project-key is for a single package, but 2 packages are scanned",
              "shared-project-name": "platform-config.sonarqube.project-name is for a single package, but 2 packages are scanned",
              "project-key-twice": "platform-config.sonarqube.project-key is set at the platform level and in the packages item 'test/projects/multi/orders'",
              "http-host": "platform-config.sonarqube.host-url must be an https URL",
              "unmatched-package": "has the path 'test/projects/missing', which matches no scanned package",
              "old-plugin-version": "platform-config.sonarqube.plugin-version is 0.2.0, but the oldest supported version is 0.3.0"
            }
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'SonarQube settings that fail')"
          jq . <<< "$ANNOTATIONS"
          while IFS=$'\t' read -r id message; do
            if [ "$FORK_PR" = true ] && { [ "$id" = no-token ] || [ "$id" = empty-token ]; }; then
              echo "$id: skipped"
              continue
            fi
            jq -e --arg c "bal scan ($id)" --arg m "$message" \
              'any(.[]; .title == $c and .annotation_level == "failure" and (.message | contains($m)))' \
              <<< "$ANNOTATIONS" > /dev/null || fail "$id: no error containing: $message"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$EXPECTED")
          # An item that matches no package is reported once, not also as setting project-key twice.
          if jq -e 'any(.[]; .title == "bal scan (unmatched-package)" and (.message | contains("is set at the platform level")))' \
            <<< "$ANNOTATIONS" > /dev/null; then
            fail "unmatched-package: an item that matches no package must not be reported as setting project-key twice"
          fi
          [ "$FAILURES" -eq 0 ] || exit 1

      - name: Check the errors of the Scan.toml settings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The errors each step must report, by step ID, which is also its category.
          EXPECTED: |
            [
              ["scan-config", "Package 'test/scan-config/http' reads its Scan.toml from 'http://localhost:8443/Scan.toml'. Use an https URL"],
              ["scan-config", "Package 'test/scan-config/unreachable': could not download its Scan.toml from 'https://scan-config.example.invalid/Scan.toml'"],
              ["scan-config", "Package 'test/scan-config/missing' sets [scan] configPath in Ballerina.toml to 'config/Scan.toml', which is not an existing file"],
              ["scan-config", "Package 'test/scan-config/no-config-path' has a [scan] table in Ballerina.toml without configPath"]
            ]
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'Scan.toml settings that fail')"
          jq . <<< "$ANNOTATIONS"
          while IFS=$'\t' read -r id message; do
            jq -e --arg c "bal scan ($id)" --arg m "$message" \
              'any(.[]; .title == $c and .annotation_level == "failure" and (.message | contains($m)))' \
              <<< "$ANNOTATIONS" > /dev/null || fail "$id: no error containing: $message"
          done < <(jq -r '.[] | @tsv' <<< "$EXPECTED")
          [ "$FAILURES" -eq 0 ] || exit 1
