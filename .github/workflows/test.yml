name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Test packages, with the findings bal scan reports for each:
#   test/projects/single                    6 low
#   test/projects/multi/orders              1 low
#   test/projects/multi/payments            2 low
#   test/projects/services/api              1 low
#   test/projects/services/internal/legacy  2 low
#   test/projects/secrets                   1 medium
#   test/projects/workspace/billing         1 low (workspace member)
#   test/projects/workspace/shipping        1 low (workspace member)
# The packages in test/sonarqube each set up one SonarQube case, with a Scan.toml or a
# sonar-project.properties file.

jobs:
  setup:
    name: Setup
    uses: ./.github/workflows/test-setup.yml

  packages:
    name: Packages
    uses: ./.github/workflows/test-packages.yml

  gate:
    name: Gate
    uses: ./.github/workflows/test-gate.yml

  reporting:
    name: Reporting
    uses: ./.github/workflows/test-reporting.yml

  sonarqube:
    name: SonarQube
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-sonarqube.yml

  scan-toml:
    name: Scan.toml
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-scan-toml.yml

  scripts:
    name: Scripts
    uses: ./.github/workflows/test-scripts.yml

  # Annotations reach the check run only after the job that wrote them has finished, so they are
  # checked from this job.
  annotation-checks:
    name: Check the annotations
    needs: [setup, reporting, sonarqube, scan-toml]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the annotations of the Annotations job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'Reporting / Annotations')"
          jq . <<< "$ANNOTATIONS"
          jq -e 'any(.path == "test/projects/multi/orders/main.bal" and .title == "ballerina:1"
              and .annotation_level == "notice" and .start_line == 5)' <<< "$ANNOTATIONS" > /dev/null \
            || fail "annotations=true must annotate the ballerina:1 finding in test/projects/multi/orders/main.bal"
          jq -e 'any(.path | startswith("test/projects/multi/payments/")) | not' <<< "$ANNOTATIONS" > /dev/null \
            || fail "annotations=false must not annotate findings"

      - name: Check the errors of the versions below the minimums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The error each step must report, by step ID, which is also its category.
          EXPECTED: |
            {
              "old-tool-version": "tool-version is 0.10.0, but the oldest supported version is 0.11.0",
              "old-ballerina-version": "ballerina-version is 2201.11.0, but bal scan 0.11.0 and later need Ballerina 2201.12.0 or later",
              "mismatched-versions": "ballerina-version is 2201.12.0, but bal scan 0.12.0 needs Ballerina 2201.13.0 or later",
              "latest-tool-version": "ballerina-version is 2201.12.0, but the latest bal scan"
            }
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'Setup / Ballerina and scan tool version selection')"
          jq . <<< "$ANNOTATIONS"
          while IFS=$'\t' read -r id message; do
            jq -e --arg c "bal scan ($id)" --arg m "$message" \
              'any(.[]; .title == $c and .annotation_level == "failure" and (.message | contains($m)))' \
              <<< "$ANNOTATIONS" > /dev/null || fail "$id: no error containing: $message"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$EXPECTED")
          [ "$FAILURES" -eq 0 ] || exit 1

      - name: Check the error of a workspace on Ballerina 2201.12.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'Setup / Oldest Ballerina and scan tool versions')"
          jq . <<< "$ANNOTATIONS"
          jq -e 'any(.[]; .title == "bal scan (workspace)" and .annotation_level == "failure"
              and (.message | contains("This run uses Ballerina 2201.12.0, which does not support workspaces")))' \
            <<< "$ANNOTATIONS" > /dev/null || fail "The workspace must fail because Ballerina 2201.12.0 does not support workspaces"
          jq -e 'any(.[]; .title == "bal scan (workspace)"
              and (.message | contains("'"'"'test/projects/workspace'"'"' is a workspace, which Ballerina 2201.12.0 does not support")))' \
            <<< "$ANNOTATIONS" > /dev/null || fail "The error must name the workspace"

      - name: Check the errors of the invalid SonarQube settings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pull requests from forks and Dependabot runs get no secrets, so there the token steps are skipped.
          NO_SECRETS: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          # The error each step must report, by step ID, which is also its category.
          EXPECTED: |
            {
              "absolute-plugin": "has the absolute path '/opt/sonar/sonar-platform-plugin.jar'",
              "http-plugin": "has the path 'http://localhost:8443/sonar-platform-plugin.jar'. Use an https URL",
              "no-token": "Package 'test/projects/multi/orders' has no SonarQube token",
              "empty-token": "platform-config.sonarqube has an empty token",
              "duplicate-keys": "resolve to the same SonarQube project key \"shared-key\"",
              "duplicate-paths": "platform-config.sonarqube.packages has the path \".\" more than once",
              "shared-project-key": "platform-config.sonarqube.project-key is for a single package, but 2 packages are scanned",
              "leftover-project-key": "platform-config.sonarqube.project-key is for a single package, but 2 packages are scanned",
              "shared-project-name": "platform-config.sonarqube.project-name is for a single package, but 2 packages are scanned",
              "project-key-twice": "platform-config.sonarqube.project-key is set at the platform level and in the packages item 'test/projects/multi/orders'",
              "http-host": "platform-config.sonarqube.host-url must be an https URL",
              "unmatched-package": "has the path 'test/projects/missing', which matches no scanned package",
              "old-plugin-version": "platform-config.sonarqube.plugin-version is 0.2.0, but the oldest supported version is 0.3.0"
            }
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'SonarQube / SonarQube settings that fail')"
          jq . <<< "$ANNOTATIONS"
          while IFS=$'\t' read -r id message; do
            if [ "$NO_SECRETS" = true ] && { [ "$id" = no-token ] || [ "$id" = empty-token ]; }; then
              echo "$id: skipped"
              continue
            fi
            jq -e --arg c "bal scan ($id)" --arg m "$message" \
              'any(.[]; .title == $c and .annotation_level == "failure" and (.message | contains($m)))' \
              <<< "$ANNOTATIONS" > /dev/null || fail "$id: no error containing: $message"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$EXPECTED")
          # An item that matches no package is reported once, not also as setting project-key twice.
          if jq -e 'any(.[]; .title == "bal scan (unmatched-package)" and (.message | contains("is set at the platform level")))' \
            <<< "$ANNOTATIONS" > /dev/null; then
            fail "unmatched-package: an item that matches no package must not be reported as setting project-key twice"
          fi
          [ "$FAILURES" -eq 0 ] || exit 1

      - name: Check the errors of the Scan.toml settings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The errors each step must report, by step ID, which is also its category.
          EXPECTED: |
            [
              ["scan-config", "Package 'test/scan-config/http' reads its Scan.toml from 'http://localhost:8443/Scan.toml'. Use an https URL"],
              ["scan-config", "Package 'test/scan-config/unreachable': could not download its Scan.toml from 'https://scan-config.example.invalid/Scan.toml'"],
              ["scan-config", "Package 'test/scan-config/missing' sets [scan] configPath in Ballerina.toml to 'config/Scan.toml', which is not an existing file"],
              ["scan-config", "Package 'test/scan-config/no-config-path' has a [scan] table in Ballerina.toml without configPath"]
            ]
        run: |
          set -euo pipefail
          FAILURES=0
          fail() { echo "::error::$1"; FAILURES=$((FAILURES + 1)); }
          ANNOTATIONS="$(bash .github/scripts/annotations.sh 'Scan.toml / Scan.toml settings that fail')"
          jq . <<< "$ANNOTATIONS"
          while IFS=$'\t' read -r id message; do
            jq -e --arg c "bal scan ($id)" --arg m "$message" \
              'any(.[]; .title == $c and .annotation_level == "failure" and (.message | contains($m)))' \
              <<< "$ANNOTATIONS" > /dev/null || fail "$id: no error containing: $message"
          done < <(jq -r '.[] | @tsv' <<< "$EXPECTED")
          [ "$FAILURES" -eq 0 ] || exit 1
